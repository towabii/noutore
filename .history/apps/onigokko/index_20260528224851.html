        }

        // ---------------------------------------------------------
        // 3. 投票終了とゲーム開始のセットアップ (ホスト専用)
        // ---------------------------------------------------------
        document.getElementById('btn-force-decide-stage').addEventListener('click', () => {
            forceDecideStage();
        });

        function checkStageVotes() {
            if (gameState.status !== 'stageSelect') return; 
            
            const activePlayers = Object.keys(gameState.players).filter(id => gameState.players[id].active);
            const voteCount = Object.keys(gameState.stageVotes).length;
            if (voteCount >= activePlayers.length && activePlayers.length >= 2) {
                forceDecideStage();
            }
        }

        function startStageSelect() {
            gameState.status = 'stageSelect';
            gameState.stageVotes = {}; 
            isStageGridBuilt = false; 
            off(ref(db, `rooms/${roomId}/join_requests`)); 
            for(let id in gameState.rematchStatus) gameState.rematchStatus[id] = false; 
            buildStageGrid();
        }

        function forceDecideStage() {
            if (gameState.status !== 'stageSelect') return; 
            
            const counts = {};
            for(let id in gameState.stageVotes) {
                let sId = gameState.stageVotes[id];
                counts[sId] = (counts[sId] || 0) + 1;
            }
            
            let maxVotes = -1;
            let selectedStage = 0;
            let hostVote = gameState.stageVotes[1]; 

            for(let sId in counts) {
                if(counts[sId] > maxVotes) {
                    maxVotes = counts[sId];
                    selectedStage = sId;
                } else if (counts[sId] === maxVotes) {
                    if (sId == hostVote) selectedStage = sId; 
                }
            }
            
            if (maxVotes === -1) selectedStage = hostVote !== undefined ? hostVote : 0;
            
            const finalStageId = parseInt(selectedStage);
            
            let activeIds = [];
            for (let id in gameState.players) {
                if (gameState.players[id].active) activeIds.push(id);
            }
            if (activeIds.length === 0) return;

            const scale = gameState.stageScale;
            // 一時的にスケール済みサイズを取得してスポーン位置を計算
            const tempStg = getScaledStage(STAGES[finalStageId], scale);
            const total = activeIds.length;
            const startX = tempStg.w / 2 - ((total - 1) * 200) / 2; 

            const spawnData = {};
            for (let i = 0; i < total; i++) {
                const id = activeIds[i];
                spawnData[id] = { x: startX + (i * 200), y: 300, vx: 0, vy: 0 };
            }

            const initialOniId = parseInt(activeIds[Math.floor(Math.random() * activeIds.length)]);

            applyGameStartData(finalStageId, initialOniId, spawnData, scale);

            hostFrameId++;
            const startCmd = {
                type: 'game_start',
                frameId: hostFrameId,
                stageId: finalStageId,
                stageScale: scale,
                oniId: initialOniId,
                spawnData: spawnData
            };

            for (let cId in clients) {
                const c = clients[cId];
                if (c.dc.readyState === 'open') {
                    c.dc.send(JSON.stringify(startCmd));
                }
            }
        }

        function applyGameStartData(stageId, oniId, spawnData, stageScale) {
            gameState.stageId = stageId;
            gameState.stageScale = stageScale;
            gameState.oniId = oniId;
            gameState.status = 'countdown';
            gameState.countdown = 3.99;
            gameState.timeLeft = gameState.timeSetting;
            gameState.globalCooldown = 0; 
            gameState.itemSpawnTimer = 60;
            gameState.items = [];
            gameState.winnerId = 0;
            
            currentStageData = getScaledStage(STAGES[stageId], stageScale);
            currentStageData.scale = stageScale;
            
            gameState.movingBlocksState = currentStageData.movingBlocks.map(mb => ({ ...mb }));

            for (let id in spawnData) {
                if (gameState.players[id]) {
                    gameState.players[id].x = spawnData[id].x;
                    gameState.players[id].y = spawnData[id].y;
                    gameState.players[id].vx = spawnData[id].vx;
                    gameState.players[id].vy = spawnData[id].vy;
                    gameState.players[id].invincible = 0;
                    gameState.players[id].warpCooldown = 0;
                    gameState.players[id].onSlope = null; 
                    gameState.players[id].onMovingBlock = null;
                    gameState.players[id].doubleJumpAvailable = true;
                    gameState.players[id].doubleJumpCooldown = 0;
                    gameState.players[id].speedBoostTime = 0;
                    gameState.players[id].shieldTime = 0;
                }
            }

            for(let id in gameState.rematchStatus) gameState.rematchStatus[id] = false;

            isGameReady = true; 
            processClientStateChange(); 
        }

        // ---------------------------------------------------------
        // 4. ゲームループと物理演算（XY分離による厳密な当たり判定）
        // ---------------------------------------------------------
        function hostLoop() {
            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1); 
            lastTime = now;

            if (isGameReady) {
                if (gameState.status === 'countdown') {
                    gameState.countdown -= dt;
                    if (gameState.countdown <= 0) gameState.status = 'playing';
                } 
                else if (gameState.status === 'playing') {
                    const stg = currentStageData;
                    if(stg) {
                        for (let mb of gameState.movingBlocksState) {
                            mb.x += mb.vx * dt;
                            mb.y += mb.vy * dt;
                            if (mb.x < mb.minX) { mb.x = mb.minX; mb.vx *= -1; }
                            if (mb.x > mb.maxX) { mb.x = mb.maxX; mb.vx *= -1; }
                            if (mb.y < mb.minY) { mb.y = mb.minY; mb.vy *= -1; }
                            if (mb.y > mb.maxY) { mb.y = mb.maxY; mb.vy *= -1; }
                        }

                        allKeys[1] = myKeys; 
                        for (let id in gameState.players) {
                            const p = gameState.players[id];
                            if (!p.active) continue;
                            applyPhysics(p, allKeys[id] || {}, dt, parseInt(id) === gameState.oniId, stg);
                        }

                        if (gameState.globalCooldown > 0) {
                            gameState.globalCooldown -= dt;
                        } else {
                            const oniP = gameState.players[gameState.oniId];
                            if (oniP && oniP.active) {
                                for (let id in gameState.players) {
                                    if (id == gameState.oniId || !gameState.players[id].active) continue;
                                    const target = gameState.players[id];

                                    const dx = oniP.x - target.x;
                                    const dy = oniP.y - target.y;
                                    // トンネリング対策として半径の判定を2.2倍にやや拡大
                                    if (Math.sqrt(dx*dx + dy*dy) < PLAYER_R * 2.2) {
                                        gameState.oniId = parseInt(id);
                                        gameState.globalCooldown = 0.5; 
                                        target.invincible = 0.5; 
                                        break; 
                                    }
                                }
                            }
                        }

                        gameState.itemSpawnTimer -= dt;
                        if (gameState.itemSpawnTimer <= 0) {
                            spawnGameItem();
                            gameState.itemSpawnTimer += 60;
                        }

                        for (let id in gameState.players) {
                            if (gameState.players[id].invincible > 0) gameState.players[id].invincible -= dt;
                        }

                        gameState.timeLeft -= dt;
                        if (gameState.timeLeft <= 0) {
                            gameState.timeLeft = 0;
                            gameState.winnerId = gameState.oniId; 
                            gameState.status = 'result';
                        }
                    }
                }
            }

            hostFrameId++;
            for (let cId in clients) {
                const c = clients[cId];
                if (c.dc.readyState === 'open') {
                    c.dc.send(JSON.stringify({ 
                        type: 'state', 
                        frameId: hostFrameId, 
                        state: gameState, 
                        assignId: c.pId 
                    }));
                }
            }

            processClientStateChange(); 
            if (gameState.status === 'stageSelect') updateStageGridUI();
            if (isGameReady) render();
            
            requestAnimationFrame(hostLoop);
        }

        function applyPhysics(p, keys, dt, isOni, stg) {
            let ACCEL = isOni ? 4500 : 4000;
            let MAX_SPEED = isOni ? 550 : 500;
            const FRICTION = 12; 
            const GRAVITY = 2500;
            const JUMP_FORCE = -1150;
            const MAX_FALL_SPEED = 1500;

            if (p.speedBoostTime > 0) {
                ACCEL *= 1.25;
                MAX_SPEED *= 1.25;
                p.speedBoostTime -= dt;
            }
            if (p.shieldTime > 0) {
                p.shieldTime -= dt;
            }

            let dir = 0;
            if (keys.left) dir -= 1;
            if (keys.right) dir += 1;

            if (p.onMovingBlock) {
                p.x += p.onMovingBlock.vx * dt;
                p.y += p.onMovingBlock.vy * dt;
            }

            if (dir !== 0) p.vx += dir * ACCEL * dt;
            else p.vx -= p.vx * FRICTION * dt;

            if (p.onSlope) {
                const dx = p.onSlope.x2 - p.onSlope.x1;
                const dy = p.onSlope.y2 - p.onSlope.y1;
                const sign = (dy / dx > 0) ? 1 : -1; 
                p.vx += sign * 1200 * dt; 
            }

            if (p.vx > MAX_SPEED) p.vx = MAX_SPEED;
            if (p.vx < -MAX_SPEED) p.vx = -MAX_SPEED;
            if (Math.abs(p.vx) < 5) p.vx = 0;

            // -------------------------
            // X軸 移動と当たり判定
            // -------------------------
            p.x += p.vx * dt;

            // X軸画面端
            if (p.x < PLAYER_R) { p.x = PLAYER_R; p.vx = 0; }
            if (p.x > stg.w - PLAYER_R) { p.x = stg.w - PLAYER_R; p.vx = 0; }

            // X軸ブロック押し戻し
            let pL = p.x - PLAYER_R, pR = p.x + PLAYER_R, pT = p.y - PLAYER_R, pB = p.y + PLAYER_R;
            for (let b of stg.solids) {
                if (pR > b.x && pL < b.x + b.w && pB > b.y && pT < b.y + b.h) {
                    if (p.vx > 0) { p.x = b.x - PLAYER_R; p.vx = 0; }
                    else if (p.vx < 0) { p.x = b.x + b.w + PLAYER_R; p.vx = 0; }
                }
            }

            // -------------------------
            // Y軸 移動と当たり判定
            // -------------------------
            let prevBottom = p.y + PLAYER_R;

            if (p.doubleJumpCooldown > 0) {
                p.doubleJumpCooldown -= dt;
                if (p.doubleJumpCooldown < 0) p.doubleJumpCooldown = 0;
            }

            p.vy += GRAVITY * dt;
            if (p.vy > MAX_FALL_SPEED) p.vy = MAX_FALL_SPEED;

            if (keys.up && !p.prevUp) {
                if (p.isGrounded) {
                    p.vy = JUMP_FORCE;
                    p.isGrounded = false;
                    p.onMovingBlock = null;
                    p.onSlope = null;
                    if (p.doubleJumpCooldown <= 0) p.doubleJumpAvailable = true;
                } else if (p.doubleJumpAvailable && p.doubleJumpCooldown <= 0) {
                    p.vy = JUMP_FORCE;
                    p.doubleJumpAvailable = false;
                    p.doubleJumpCooldown = 3.0;
                }
            }
            p.prevUp = keys.up;

            p.y += p.vy * dt;
            p.isGrounded = false;
            p.onSlope = null; 
            p.onMovingBlock = null;

            // Y軸画面端
            if (p.y < PLAYER_R) { p.y = PLAYER_R; p.vy = 0; }
            if (p.y > stg.h - PLAYER_R) { p.y = stg.h - PLAYER_R; p.vy = 0; p.isGrounded = true; }

            // Y軸ブロック押し戻し
            pL = p.x - PLAYER_R; pR = p.x + PLAYER_R; pT = p.y - PLAYER_R; pB = p.y + PLAYER_R;
            for (let b of stg.solids) {
                if (pR > b.x && pL < b.x + b.w && pB > b.y && pT < b.y + b.h) {
                    if (p.vy > 0) { p.y = b.y - PLAYER_R; p.vy = 0; p.isGrounded = true; }
                    else if (p.vy < 0) { p.y = b.y + b.h + PLAYER_R; p.vy = 0; }
                }
            }

            // ジャンプスルー（片方向床）
            for (let jt of stg.jumpThroughs) {
                pB = p.y + PLAYER_R;
                if (pR > jt.x && pL < jt.x + jt.w) {
                    // トンネリング対策に1ピクセルとdtの落下量を考慮
                    if (p.vy >= 0 && prevBottom <= jt.y + Math.max(1, p.vy*dt) && pB >= jt.y) {
                        p.y = jt.y - PLAYER_R; p.vy = 0; p.isGrounded = true;
                    }
                }
            }

            // 動く床
            for (let mb of gameState.movingBlocksState) {
                pB = p.y + PLAYER_R;
                if (pR > mb.x && pL < mb.x + mb.w) {
                    let maxFall = Math.max(1, mb.vy * dt);
                    if (p.vy >= 0 && prevBottom <= mb.y + maxFall && pB >= mb.y) {
                        p.y = mb.y - PLAYER_R; p.vy = 0; p.isGrounded = true;
                        p.onMovingBlock = mb;
                    }
                }
            }

            // バウンスブロック
            for (let bb of stg.bouncyBlocks || []) {
                if (pR > bb.x && pL < bb.x + bb.w && pB > bb.y && pT < bb.y + bb.h) {
                    if (p.vy >= 0) {
                        p.y = bb.y - PLAYER_R;
                        p.vy = -1550;
                        p.isGrounded = true;
                    }
                }
            }

            // ハザードブロック
            for (let hb of stg.hazardBlocks || []) {
                if (pR > hb.x && pL < hb.x + hb.w && pB > hb.y && pT < hb.y + hb.h) {
                    p.vx *= 0.52;
                    if (p.vy >= 0) {
                        p.y = hb.y - PLAYER_R;
                        p.vy = 0;
                        p.isGrounded = true;
                    }
                }
            }

            // アイテム取得判定
            if (gameState.items && gameState.items.length) {
                for (let i = gameState.items.length - 1; i >= 0; i--) {
                    const item = gameState.items[i];
                    const dx = p.x - item.x;
                    const dy = p.y - item.y;
                    if (Math.sqrt(dx*dx + dy*dy) < PLAYER_R + 20) {
                        applyItemPickup(p, item);
                        gameState.items.splice(i, 1);
                    }
                }
            }

            // 坂道
            for (let sl of stg.slopes) {
                if (p.x >= sl.x1 && p.x <= sl.x2) {
                    let lineY = sl.y1 + (sl.y2 - sl.y1) * (p.x - sl.x1) / (sl.x2 - sl.x1);
                    pB = p.y + PLAYER_R;
                    if (p.vy >= 0 && prevBottom <= lineY + Math.max(10, p.vy*dt) && pB >= lineY - 5) {
                        p.y = lineY - PLAYER_R; p.vy = 0; p.isGrounded = true;
                        p.onSlope = sl;
                    }
                }
            }

            // ジャンプパッド
            for (let jp of stg.jumpPads) {
                pT = p.y - PLAYER_R;
                if (pR > jp.x && pL < jp.x + jp.w && pB > jp.y && pT < jp.y + jp.h) {
                    p.vy = jp.force; p.isGrounded = false;
                }
            }

            // -------------------------
            // ワープホールの判定
            // -------------------------
            if (p.warpCooldown <= 0) {
                for (let w of stg.warps) {
                    let dx = p.x - w.x;
                    let dy = p.y - w.y;
                    if (Math.sqrt(dx*dx + dy*dy) < PLAYER_R + w.r) {
                        let targetWarp = stg.warps.find(tw => tw.id === w.targetId);
                        if (targetWarp) {
                            p.x = targetWarp.x;
                            p.y = targetWarp.y - 10; // 少し上にワープさせて埋まりを防止
                            p.vx = 0; p.vy = 0;      // 慣性をリセット
                            p.warpCooldown = 1.0;    // 1秒間のクールダウン
                            break;
                        }
                    }
                }
            } else {
                p.warpCooldown -= dt;
            }

            if (p.isGrounded && p.doubleJumpCooldown <= 0) {
                p.doubleJumpAvailable = true;
            }
        }

        function clientLoop() {
            if (hostDc && hostDc.readyState === 'open') {
                hostDc.send(JSON.stringify({ type: 'input', keys: myKeys }));
            }
            
            if (gameState.status === 'stageSelect') updateStageGridUI();
            if (isGameReady) render();
            
            requestAnimationFrame(clientLoop);
        }

        // ---------------------------------------------------------
        // 5. 描画とダイナミックカメラ・ワープ・鎌エフェクト
        // ---------------------------------------------------------
        function render() {
            if (!isGameReady) return; 
            
            const stg = currentStageData;
            if (!stg) return;

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            let activeCount = 0;
            for (let id in gameState.players) {
                const p = gameState.players[id];
                if (!p.active || p.x === undefined) continue;
                if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
                activeCount++;
            }
            if (activeCount === 0) { minX = stg.w/2; maxX = stg.w/2; minY = stg.h/2; maxY = stg.h/2; }

            const M_X = 600, M_Y = 450; 
            const reqW = (maxX - minX) + M_X;
            const reqH = (maxY - minY) + M_Y;
            const scaleX = CANVAS_W / reqW;
            const scaleY = CANVAS_H / reqH;

            // サイズ「小」でも破綻しないようズームの限界値を0.15に設定
            let targetScale = Math.min(scaleX, scaleY);
            targetScale = Math.max(0.15, Math.min(1.0, targetScale));

            const midX = (minX + maxX) / 2;
            const midY = (minY + maxY) / 2;

            camera.x = lerp(camera.x, midX, 0.1);
            camera.y = lerp(camera.y, midY, 0.1);
            camera.scale = lerp(camera.scale, targetScale, 0.08);

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#0f1015'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.scale(dpr, dpr);
            ctx.save();
            ctx.translate(CANVAS_W / 2, CANVAS_H / 2);
            ctx.scale(camera.scale, camera.scale);
            ctx.translate(-camera.x, -camera.y);

            ctx.fillStyle = '#1a1d24'; ctx.fillRect(0, 0, stg.w, stg.h);
            ctx.strokeStyle = '#2a2d36'; ctx.lineWidth = 2; ctx.beginPath();
            for(let i=0; i<=stg.w; i+=150*stg.scale) { ctx.moveTo(i,0); ctx.lineTo(i,stg.h); }
            for(let i=0; i<=stg.h; i+=150*stg.scale) { ctx.moveTo(0,i); ctx.lineTo(stg.w,i); }
            ctx.stroke();
            ctx.strokeStyle = '#555'; ctx.lineWidth = 10; ctx.strokeRect(0, 0, stg.w, stg.h);

            ctx.fillStyle = '#111827'; ctx.strokeStyle = '#374151'; ctx.lineWidth = 4;
            for(let b of stg.solids) { ctx.fillRect(b.x, b.y, b.w, b.h); ctx.strokeRect(b.x, b.y, b.w, b.h); }

            ctx.fillStyle = 'rgba(45, 55, 72, 0.7)'; ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3;
            for(let jt of stg.jumpThroughs) {
                ctx.fillRect(jt.x, jt.y, jt.w, jt.h);
                ctx.beginPath(); ctx.moveTo(jt.x, jt.y); ctx.lineTo(jt.x + jt.w, jt.y); ctx.stroke();
            }

            ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 8; ctx.lineCap = 'round';
            for(let sl of stg.slopes) {
                ctx.beginPath(); ctx.moveTo(sl.x1, sl.y1); ctx.lineTo(sl.x2, sl.y2); ctx.stroke();
            }

            ctx.fillStyle = '#4B0082'; ctx.strokeStyle = '#8A2BE2'; ctx.lineWidth = 4;
            const mbs = isHost ? gameState.movingBlocksState : gameState.movingBlocksState;
            for(let mb of mbs) {
                ctx.fillRect(mb.x, mb.y, mb.w, mb.h); ctx.strokeRect(mb.x, mb.y, mb.w, mb.h);
            }

            ctx.fillStyle = '#ff6600'; ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 3;
            for(let jp of stg.jumpPads) {
                ctx.fillRect(jp.x, jp.y, jp.w, jp.h); ctx.strokeRect(jp.x, jp.y, jp.w, jp.h);
                ctx.beginPath(); ctx.moveTo(jp.x+10, jp.y+jp.h/2); ctx.lineTo(jp.x+jp.w-10, jp.y+jp.h/2); ctx.stroke();
            }

            ctx.fillStyle = '#34d7ff'; ctx.strokeStyle = '#b4f1ff'; ctx.lineWidth = 3;
            for (let bb of stg.bouncyBlocks || []) {
                ctx.fillRect(bb.x, bb.y, bb.w, bb.h);
                ctx.strokeRect(bb.x, bb.y, bb.w, bb.h);
                ctx.beginPath(); ctx.moveTo(bb.x + 12, bb.y + 8); ctx.lineTo(bb.x + bb.w - 12, bb.y + 8); ctx.stroke();
            }
            ctx.fillStyle = 'rgba(255, 80, 80, 0.6)'; ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 2;
            for (let hb of stg.hazardBlocks || []) {
                ctx.fillRect(hb.x, hb.y, hb.w, hb.h);
                ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
            }

            if (gameState.items && gameState.items.length > 0) {
                for (let item of gameState.items) {
                    ctx.save();
                    ctx.translate(item.x, item.y);
                    if (item.type === 'speed') {
                        ctx.fillStyle = '#ffd340';
                        ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('S', 0, 6);
                    } else if (item.type === 'shield') {
                        ctx.fillStyle = '#4de5ff';
                        ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
                        ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI, true); ctx.stroke();
                    } else {
                        ctx.fillStyle = '#d84dff';
                        ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif'; ctx.fillText('T', 0, 6);
                    }
                    ctx.restore();
                }
            }

            // ワープホールの描画（光る渦巻きエフェクト）
            const t = Date.now() / 300;
            for (let w of stg.warps) {
                ctx.save();
                ctx.translate(w.x, w.y);
                ctx.rotate(t);
                
                ctx.beginPath();
                ctx.arc(0, 0, w.r, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(150, 0, 255, 0.8)';
                ctx.lineWidth = 4;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(0, 0, w.r * 0.7, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(200, 50, 255, 0.6)';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(0, 0, w.r * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 100, 255, 0.9)';
                ctx.fill();
                
                ctx.restore();
            }

            for (let id in gameState.players) {
                const p = gameState.players[id];
                if (!p.active || p.x === undefined || p.y === undefined) continue; 
                
                const isMe = parseInt(id) === myPlayerId;
                const isOni = parseInt(id) === gameState.oniId;
                
                ctx.globalAlpha = (p.invincible > 0 && isOni) ? (0.4 + 0.6 * Math.sin(Date.now()/30)) : 1.0;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, PLAYER_R, 0, Math.PI*2);
                ctx.fillStyle = p.color;
                
                if (isOni) { ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 20; } 
                else { ctx.shadowColor = p.color; ctx.shadowBlur = 10; }
                
                ctx.fill(); ctx.shadowBlur = 0; 

                if (isOni) {
                    let targetAngle = 0; let minDist = Infinity;
                    for (let oid in gameState.players) {
                        if (oid === id || !gameState.players[oid].active) continue;
                        const other = gameState.players[oid];
                        if (other.x === undefined) continue;
                        const dist = Math.sqrt(Math.pow(other.x - p.x, 2) + Math.pow(other.y - p.y, 2));
                        if (dist < minDist) { minDist = dist; targetAngle = Math.atan2(other.y - p.y, other.x - p.x); }
                    }
                    if (minDist === Infinity) targetAngle = Math.PI / -2; 

                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(targetAngle); ctx.translate(PLAYER_R + 10, 0); 
                    ctx.fillStyle = '#654321'; ctx.fillRect(-4, -35, 8, 70);
                    ctx.beginPath(); ctx.moveTo(0, -35); ctx.quadraticCurveTo(45, -35, 45, -10); ctx.quadraticCurveTo(20, -20, 0, 5);
                    ctx.fillStyle = '#e0e0e0'; ctx.fill(); ctx.strokeStyle = '#999'; ctx.lineWidth=1; ctx.stroke();
                    ctx.restore();
                }
                ctx.globalAlpha = 1.0;

                ctx.fillStyle = '#fff'; 
                ctx.font = '18px bold sans-serif';
                ctx.textAlign = 'center'; 
                ctx.fillText(p.name || 'Player', p.x, p.y - 35);
                
                if (isMe) {
                    ctx.fillStyle = '#ff0';
                    ctx.font = '16px bold sans-serif';
                    ctx.fillText('▼YOU', p.x, p.y - 55);
                }
            }
            ctx.restore();

            document.getElementById('time-display').innerText = Math.ceil(gameState.timeLeft);
            const roleEl = document.getElementById('role-text');
            if (gameState.oniId === myPlayerId) {
                roleEl.innerText = '【鬼】'; roleEl.className = 'text-oni';
            } else {
                roleEl.innerText = '【逃げ】'; roleEl.className = 'text-nige';
            }

            const cooldownText = document.getElementById('jump-cooldown-text');
            const cooldownFill = document.getElementById('jump-cooldown-fill');
            const selfPlayer = gameState.players[myPlayerId];
            if (selfPlayer && cooldownText && cooldownFill) {
                if (selfPlayer.doubleJumpCooldown > 0) {
                    cooldownText.innerText = `${selfPlayer.doubleJumpCooldown.toFixed(1)}s`;
                    cooldownFill.style.width = `${Math.max(0, Math.min(100, (selfPlayer.doubleJumpCooldown / 3) * 100))}%`;
                } else {
                    cooldownText.innerText = 'READY';
                    cooldownFill.style.width = '100%';
                }
            }

            if (gameState.status === 'countdown') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                ctx.fillStyle = '#fff'; ctx.font = '80px bold sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(Math.ceil(gameState.countdown).toString(), CANVAS_W/2, CANVAS_H/2 + 25);
            }
        }

        // ---------------------------------------------------------
        // 6. 再戦準備フロー
        // ---------------------------------------------------------
        document.getElementById('btn-ready').addEventListener('click', () => {
            if (isHost) {
                gameState.rematchStatus[myPlayerId] = true;
            } else {
                if (hostDc && hostDc.readyState === 'open') {
                    hostDc.send(JSON.stringify({ type: 'rematch_ready' }));
                }
            }
            document.getElementById('btn-ready').classList.add('hidden');
        });

        // ---------------------------------------------------------
        // 7. ESC中断 & 入力イベント設定
        // ---------------------------------------------------------
        function handleKey(e, isDown) {
            const key = e.key.toLowerCase();
            if (['w', 'arrowup'].includes(key)) { myKeys.up = isDown; e.preventDefault(); }
            if (['s', 'arrowdown'].includes(key)) { myKeys.down = isDown; e.preventDefault(); }
            if (['a', 'arrowleft'].includes(key)) { myKeys.left = isDown; e.preventDefault(); }
            if (['d', 'arrowright'].includes(key)) { myKeys.right = isDown; e.preventDefault(); }
            
            if (key === 'escape' && isDown) {
                if (gameState.status === 'playing' || gameState.status === 'countdown') {
                    if (isHost) {
                        broadcastAbort(myNickname);
                        abortAndReturnHome(`${myNickname} によってゲームが中断されました。`);
                    } else {
                        if (hostDc && hostDc.readyState === 'open') {
                            hostDc.send(JSON.stringify({ type: 'abort', playerName: myNickname }));
                        }
                        abortAndReturnHome(`${myNickname} によってゲームが中断されました。`);
                    }
                }
            }
        }
        window.addEventListener('keydown', e => handleKey(e, true), { passive: false });
        window.addEventListener('keyup', e => handleKey(e, false), { passive: false });

    </script>
</body>
</html>
