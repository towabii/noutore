<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 鬼ごっこ 大乱闘マルチプレイ版</title>
    <style>
        :root {
            --bg-dark: #02040b;
            --panel-dark: rgba(8, 12, 20, 0.72);
            --panel-border: rgba(0, 255, 255, 0.18);
            --neon-cyan: #00f7ff;
            --neon-magenta: #ff2ae8;
            --neon-blue: #4de5ff;
            --neon-pink: #ff45d9;
            --neon-yellow: #ffe24d;
            --danger: #ff3366;
            --danger-glow: rgba(255, 51, 102, 0.45);
            --text: #e6edf7;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            min-width: 0;
            background: radial-gradient(circle at top, rgba(0, 120, 255, 0.12), transparent 28%),
                        linear-gradient(180deg, #03060f 0%, #05070f 48%, #010205 100%);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: min(100%, calc(100vh * 16 / 9));
            max-height: calc(100vh - 40px);
            aspect-ratio: 16 / 9;
            background: #05070e;
            box-shadow: 0 0 90px rgba(0, 255, 255, 0.08), inset 0 0 40px rgba(255, 255, 255, 0.04);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 28px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        canvas { display: block; width: 100%; height: 100%; }

        #menuBgCanvas {
            position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2;
            pointer-events: none; opacity: 0; transition: opacity 0.8s ease;
            filter: contrast(1.1) saturate(1.1);
        }

        #home-screen {
            padding: 24px;
            background: rgba(4, 8, 18, 0.28);
            backdrop-filter: blur(26px);
        }

        #boot-screen {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 50% 20%, rgba(0, 255, 255, 0.08), transparent 35%),
                        rgba(0, 0, 0, 0.96);
            z-index: 12;
            color: #d9f3ff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.25);
        }

        #boot-screen.hidden { display: none !important; }

        #boot-panel {
            width: min(760px, 92%);
            padding: 30px 30px 42px;
            border: 1px solid rgba(0, 255, 255, 0.16);
            border-radius: 28px;
            background: rgba(3, 5, 12, 0.92);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.14);
            backdrop-filter: blur(16px);
        }

        .boot-logo {
            font-size: clamp(2.4rem, 5vw, 4.2rem);
            letter-spacing: 0.3em;
            line-height: 1.05;
            margin-bottom: 26px;
            font-weight: 800;
            text-transform: uppercase;
            color: #d9f3ff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.4), 0 0 30px rgba(255, 50, 255, 0.15);
        }

        .boot-lines {
            display: grid; gap: 16px;
        }

        .boot-line {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            color: rgba(224, 244, 255, 0.95);
            min-height: 28px;
            white-space: pre;
            overflow: hidden;
        }

        .boot-line span {
            display: inline-block;
            opacity: 0;
            animation: fadeInLine 0.3s ease forwards;
        }

        @keyframes fadeInLine {
            to { opacity: 1; }
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 18, 0.55);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
        }
        
        .hidden { display: none !important; }

        #home-screen {
            padding: 24px;
        }

        #home-card {
            width: min(420px, 92%);
            padding: 32px 28px;
            display: flex; flex-direction: column; align-items: center;
            gap: 24px;
            margin: 0 auto;
            background: rgba(6, 10, 20, 0.72);
            border: 1px solid rgba(0, 255, 255, 0.18);
            box-shadow: 0 0 100px rgba(0, 255, 255, 0.09);
            backdrop-filter: blur(32px);
            border-radius: 32px;
            text-align: center;
        }

        #home-screen h1 {
            margin: 0;
            font-size: clamp(2.4rem, 6vw, 4rem);
            line-height: 1.05;
            letter-spacing: 0.08em;
            color: #effcff;
            text-shadow: 0 0 18px rgba(0, 255, 255, 0.45), 0 0 60px rgba(255, 0, 255, 0.15);
        }

        #home-screen h1 span {
            display: block;
            font-size: 1.05em;
            letter-spacing: 0.1em;
            color: rgba(242, 249, 255, 0.76);
            text-shadow: none;
        }

        .input-group {
            display: flex; flex-direction: column; gap: 14px; width: 100%; margin-bottom: 0;
            align-items: center;
        }

        input, select {
            width: 100%;
            max-width: 360px;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            background: rgba(8, 14, 26, 0.82);
            color: #f7fbff;
            font-size: 1rem;
            outline: none;
            text-align: center;
            font-weight: 700;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
        }
        input::placeholder { color: rgba(255,255,255,0.45); }
        input:focus, select:focus { border-color: rgba(0, 255, 255, 0.38); box-shadow: 0 0 24px rgba(0, 255, 255, 0.18); }
        select { cursor: pointer; }

        button {
            padding: 16px 24px; border: none; border-radius: 16px;
            font-size: 1.05rem; font-weight: 800; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: auto; min-width: 230px; max-width: 100%; box-sizing: border-box;
            letter-spacing: 0.03em;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(120deg, rgba(255,255,255,0.08), transparent 30%, rgba(255,255,255,0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        button:hover::before { opacity: 1; }

        button:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        .btn-host {
            color: #f1f8ff;
            background: linear-gradient(135deg, rgba(255,50,255,0.28), rgba(0, 255, 255, 0.16));
            border: 1px solid rgba(255, 50, 255, 0.32);
            box-shadow: 0 0 28px rgba(255, 50, 255, 0.18), 0 12px 30px rgba(36, 0, 64, 0.35);
        }
        .btn-host:hover:not(:disabled) { transform: translateY(-3px); animation: glitch 0.7s; }

        .btn-client {
            color: #001117;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.55), rgba(20, 70, 140, 0.35));
            border: 1px solid rgba(0, 255, 255, 0.38);
            box-shadow: 0 0 28px rgba(0, 255, 255, 0.25), 0 12px 30px rgba(0, 40, 70, 0.35);
        }
        .btn-client:hover:not(:disabled) { transform: translateY(-3px); animation: glitch 0.7s; }

        .btn-action {
            color: #f9fdf5;
            background: linear-gradient(135deg, rgba(128, 255, 180, 0.28), rgba(28, 82, 41, 0.35));
            border: 1px solid rgba(128, 255, 180, 0.25);
            box-shadow: 0 0 32px rgba(128, 255, 180, 0.18), 0 12px 24px rgba(3, 18, 8, 0.25);
        }
        .btn-action:hover:not(:disabled) { transform: translateY(-3px); animation: glitch 0.7s; }

        .btn-back {
            color: #effcff;
            background: rgba(17, 22, 36, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 24px rgba(0,0,0,0.2);
        }
        .btn-back:hover:not(:disabled) { transform: translateY(-3px); }

        @keyframes glitch {
            0% { transform: translateX(0); }
            20% { transform: translateX(-1px) skewX(-1deg); }
            40% { transform: translateX(1px) skewX(1deg); }
            60% { transform: translateX(-1px) skewY(-1deg); }
            80% { transform: translateX(1px) skewY(1deg); }
            100% { transform: translateX(0); }
        }

        #stage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            justify-content: center;
            max-width: 100%;
            width: 100%;
        }
        .stage-card {
            width: 100%; background: rgba(12,18,32,0.9);
            border: 1px solid rgba(0,255,255,0.14);
            box-shadow: 0 0 20px rgba(0,255,255,0.08);
            border-radius: 20px; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
            font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: transform 0.2s ease, border-color 0.2s ease; color: #f3f8ff;
            position: relative;
            overflow: hidden;
            min-height: 170px;
        }
        .stage-card::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, transparent 10%, rgba(255,255,255,0.03) 20%, transparent 35%);
            opacity: 0.5;
        }
        .stage-thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px 18px 0 0;
            background-size: cover;
            background-position: center;
            margin-bottom: 12px;
        }
        .stage-card > div { z-index: 1; }
        .stage-card-title {
            padding: 0 16px 8px;
            text-align: center;
        }
        .stage-card-title small {
            display: block;
            margin-top: 6px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.68);
            font-weight: 400;
        }
        #popup-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.72);
            z-index: 50;
            padding: 20px;
        }
        #popup-overlay.active {
            display: flex;
        }
        .popup-card {
            width: min(480px, 100%);
            padding: 26px 24px;
            background: rgba(4, 8, 18, 0.92);
            border: 1px solid rgba(0, 255, 255, 0.22);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.18);
            border-radius: 28px;
            text-align: center;
            color: #f7fbff;
            backdrop-filter: blur(18px);
        }
        .popup-message {
            margin-bottom: 22px;
            font-size: 1rem;
            line-height: 1.6;
            letter-spacing: 0.02em;
        }
        .popup-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .popup-actions button {
            min-width: 120px;
        }
        @media (max-width: 640px) {
            #home-card {
                padding: 22px 18px;
            }
            .input-group {
                gap: 12px;
            }
            button {
                min-width: 180px;
                padding: 14px 20px;
            }
            #hud {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            #jump-cooldown { min-width: auto; }
        }
        .stage-card:hover { border-color: var(--neon-cyan); transform: scale(1.04); }
        .vote-area { display: flex; gap: 6px; margin-top: 12px; height: 16px; justify-content: center; width: 100%; }
        .vote-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 8px rgba(0,0,0,0.4); }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 2% 3%; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 5;
        }
        .hud-box {
            background: rgba(4, 8, 18, 0.85); padding: 14px 20px;
            border-radius: 16px; border: 1px solid rgba(0,255,255,0.12);
            font-size: 1.15rem; font-weight: 700;
            box-shadow: 0 0 30px rgba(0,255,255,0.08);
        }
        #role-display { font-size: 1.35rem; }
        #jump-cooldown { min-width: 220px; }
        #jump-cooldown .cooldown-bar {
            width: 100%; height: 7px; margin-top: 8px;
            border-radius: 999px; background: rgba(255,255,255,0.1);
            overflow: hidden;
        }
        #jump-cooldown-fill {
            width: 100%; height: 100%; background: linear-gradient(90deg, rgba(0,255,255,0.95), rgba(0,170,255,0.55));
            transform-origin: left center;
            transition: width 0.1s ease;
        }
        .hud-box small { display: block; margin-top: 6px; color: rgba(255,255,255,0.72); font-size: 0.9rem; }
        .text-oni { color: var(--danger); text-shadow: 0 0 12px var(--danger); }
        .text-nige { color: var(--neon-cyan); text-shadow: 0 0 12px var(--neon-cyan); }

        #result-card {
            width: min(480px, 92%);
            padding: 28px 28px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            background: rgba(5, 8, 18, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.18);
            backdrop-filter: blur(24px);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 255, 0.12);
        }

        #result-outcome {
            font-size: clamp(3rem, 6vw, 5.2rem);
            font-weight: 900;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 24px rgba(0, 255, 255, 0.45), 0 0 58px rgba(255, 0, 255, 0.18);
        }

        #result-title { font-size: 2rem; margin: 0; letter-spacing: 0.08em; color: #d8e9ff; }
        #result-desc { font-size: 1.3rem; margin-bottom: 5px; color: #d8e9ff; font-weight: 700; text-align: center; }
        .status-msg { margin-top: 20px; font-size: 1.05rem; color: #c1d6ff; text-align: center; white-space: pre-line; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="game-wrapper">
            <canvas id="gameCanvas"></canvas>
            <canvas id="menuBgCanvas"></canvas>

            <div id="hud" class="hidden">
                <div class="hud-box">残り時間: <span id="time-display">60</span>秒</div>
                <div class="hud-box" id="role-display">あなたは<span id="role-text">---</span></div>
                <div class="hud-box" id="jump-cooldown">
                    2段ジャンプ: <span id="jump-cooldown-text">READY</span>
                    <div class="cooldown-bar"><div id="jump-cooldown-fill"></div></div>
                </div>
            </div>

            <!-- 1. ホーム画面 -->
            <div id="home-screen" class="overlay hidden">
                <div id="home-card">
                    <h1>2D 鬼ごっこ<br><span>大乱闘マルチプレイ</span></h1>
                    <div class="input-group">
                        <input type="text" id="nickname-input" placeholder="あなたのニックネーム" autocomplete="off" maxlength="10">
                        <button class="btn-host" id="btn-go-host">ゲームを作成する (ホスト)</button>
                        <button class="btn-client" id="btn-go-client">ゲームに参加する (クライアント)</button>
                    </div>
                    <div class="status-msg">※操作: [W/↑] ジャンプ , [A/D/←→] 移動<br>※プレイ中に[ESC]キーで中断</div>
                </div>
            </div>

            <!-- 2-A. ホスト設定画面 (ステージサイズ追加) -->
            <div id="host-setup-screen" class="overlay hidden">
                <h2>部屋の作成</h2>
                <div class="input-group">
                    <input type="text" id="host-room-id" placeholder="部屋の合言葉 (例: room123)" autocomplete="off">
                    <select id="stage-size">
                        <option value="1.0" selected>広さ: 大 (3400x2040) 大人数向け</option>
                        <option value="0.7">広さ: 中 (2380x1428) 標準サイズ</option>
                        <option value="0.47">広さ: 小 (1598x958) 少人数・超ハイスピード</option>
                    </select>
                    <select id="game-time">
                        <option value="60" selected>制限時間: 1分</option>
                        <option value="120">制限時間: 2分</option>
                        <option value="180">制限時間: 3分</option>
                    </select>
                    <select id="max-players">
                        <option value="2" selected>最大人数: 2人</option>
                        <option value="3">最大人数: 3人</option>
                        <option value="4">最大人数: 4人</option>
                        <option value="5">最大人数: 5人</option>
                    </select>
                    <button class="btn-host" id="btn-create-room">この設定で作成</button>
                    <button class="btn-back" id="btn-back-host">戻る</button>
                </div>
            </div>

            <!-- 2-B. クライアント設定画面 -->
            <div id="client-setup-screen" class="overlay hidden">
                <h2>部屋に参加</h2>
                <div class="input-group">
                    <input type="text" id="client-room-id" placeholder="教えてもらった合言葉" autocomplete="off">
                    <button class="btn-client" id="btn-join-room">参加する</button>
                    <button class="btn-back" id="btn-back-client">戻る</button>
                </div>
            </div>

            <!-- 3. ロビー待機画面 -->
            <div id="lobby-screen" class="overlay hidden">
                <h2>ロビー待機中</h2>
                <div id="lobby-status" style="font-size: 1.5rem; margin-bottom: 20px; font-weight: bold;">参加者: 1 / 2 人</div>
                <div class="input-group" style="width: 280px;">
                    <button class="btn-action hidden" id="btn-force-start" disabled>2人以上で開始可能</button>
                </div>
                <div class="status-msg" id="lobby-msg">ホストの操作を待っています...</div>
            </div>

            <!-- 4. ステージ選択・投票画面 -->
            <div id="stage-screen" class="overlay hidden">
                <h2>ステージ投票</h2>
                <div id="stage-grid">
                    <!-- JSで動的に生成 -->
                </div>
                <div class="status-msg" id="stage-msg" style="margin-top: 20px;">好きなステージを選んでください！</div>
                <div class="input-group" style="width: 280px; margin-top: 20px;">
                    <button class="btn-action hidden" id="btn-force-decide-stage">投票を締め切る (ホスト専用)</button>
                </div>
            </div>

            <!-- 5. リザルト画面 -->
            <div id="result-screen" class="overlay hidden">
                <div id="result-card">
                    <div id="result-outcome" class="result-outcome">RESULT</div>
                    <h1 id="result-title">ゲーム終了</h1>
                    <div id="result-desc">敗北(鬼): ---<br>勝者(逃げ): ---</div>
                    <div class="input-group" style="width: 280px;">
                        <button class="btn-action" id="btn-ready">再度プレイ準備OK</button>
                        <button class="btn-back" id="btn-go-home">ホームに戻る</button>
                    </div>
                    <div id="rematch-status" class="status-msg"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="popup-overlay">
        <div class="popup-card">
            <div class="popup-message" id="popup-message"></div>
            <div class="popup-actions">
                <button class="btn-action" id="popup-close">OK</button>
            </div>
        </div>
    </div>

    <!-- Firebase v10 モジュールインポート -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, get, onValue, off, remove, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDeVPFYsQIwBjHw3zfQnGJvpRFZXj1V8Yk",
            authDomain: "toway-ee817.firebaseapp.com",
            databaseURL: "https://toway-ee817-default-rtdb.firebaseio.com",
            projectId: "toway-ee817",
            storageBucket: "toway-ee817.firebasestorage.app",
            messagingSenderId: "1031134467398",
            appId: "1:1031134467398:web:e04be1bb04466847520147",
            measurementId: "G-3J0VQ18QGS"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ---------------------------------------------------------
        // 高解像度Retina対応 Canvasセットアップ
        // ---------------------------------------------------------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menuCanvas = document.getElementById('menuBgCanvas');
        const menuCtx = menuCanvas.getContext('2d');
        const CANVAS_W = 800, CANVAS_H = 450;
        let dpr = 1;
        let menuWidth = CANVAS_W;
        let menuHeight = CANVAS_H;
        let menuParticles = [];
        let menuMouse = { x: menuWidth / 2, y: menuHeight / 2 };
        let menuAnimationId = null;
        let menuFrameTime = 0;

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            canvas.width = CANVAS_W * dpr;
            canvas.height = CANVAS_H * dpr;
            canvas.style.width = '100%';
            canvas.style.height = '100%';

            const rect = menuCanvas.getBoundingClientRect();
            const menuDpr = window.devicePixelRatio || 1;
            menuWidth = rect.width;
            menuHeight = rect.height;
            menuCanvas.width = Math.max(1, Math.floor(rect.width * menuDpr));
            menuCanvas.height = Math.max(1, Math.floor(rect.height * menuDpr));
            menuCanvas.style.width = '100%';
            menuCanvas.style.height = '100%';
            menuCtx.setTransform(menuDpr, 0, 0, menuDpr, 0, 0);
            menuMouse.x = Math.min(menuMouse.x, menuWidth);
            menuMouse.y = Math.min(menuMouse.y, menuHeight);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ---------------------------------------------------------
        // システム・定数・ステージ定義
        // ---------------------------------------------------------
        const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
        const PLAYER_R = 25;
        const PLAYER_COLORS = {
            1: '#ff3366', 2: '#00ffff', 3: '#33ff33', 4: '#ffff33', 5: '#cc33ff',
            6: '#ff8f00', 7: '#4dd0ff', 8: '#ff5a00', 9: '#adff2f', 10: '#d600ff'
        };

        let myNickname = "";
        let isHost = false;
        let myPlayerId = null;
        let myClientId = null;

        // スケールに応じたステージデータを動的に生成する関数
        function getScaledStage(baseStage, scale) {
            return {
                id: baseStage.id,
                name: baseStage.name,
                w: baseStage.w * scale,
                h: baseStage.h * scale,
                solids: baseStage.solids.map(b => ({x: b.x*scale, y: b.y*scale, w: b.w*scale, h: b.h*scale})),
                jumpThroughs: baseStage.jumpThroughs.map(b => ({x: b.x*scale, y: b.y*scale, w: b.w*scale, h: b.h*scale})),
                slopes: baseStage.slopes.map(b => ({x1: b.x1*scale, y1: b.y1*scale, x2: b.x2*scale, y2: b.y2*scale})),
                movingBlocks: baseStage.movingBlocks.map(b => ({
                    x: b.x*scale, y: b.y*scale, w: b.w*scale, h: b.h*scale,
                    vx: b.vx, vy: b.vy, // 速度はスケールさせずハイスピード感を維持
                    minX: b.minX*scale, maxX: b.maxX*scale,
                    minY: b.minY*scale, maxY: b.maxY*scale
                })),
                jumpPads: baseStage.jumpPads.map(b => ({
                    x: b.x*scale, y: b.y*scale, w: b.w*scale, h: b.h*scale, force: b.force // ジャンプ力も維持
                })),
                bouncyBlocks: (baseStage.bouncyBlocks || []).map(b => ({ x: b.x*scale, y: b.y*scale, w: b.w*scale, h: b.h*scale })),
                hazardBlocks: (baseStage.hazardBlocks || []).map(b => ({ x: b.x*scale, y: b.y*scale, w: b.w*scale, h: b.h*scale })),
                items: (baseStage.items || []).map(item => ({ ...item, x: item.x*scale, y: item.y*scale })),
                warps: baseStage.warps.map(w => ({
                    id: w.id, x: w.x*scale, y: w.y*scale, r: w.r*scale, targetId: w.targetId
                }))
            };
        }

        function showScreen(screenId) {
            const screens = ['home-screen', 'host-setup-screen', 'client-setup-screen', 'lobby-screen', 'stage-screen', 'result-screen'];
            screens.forEach(s => {
                const el = document.getElementById(s);
                if (el) el.classList.add('hidden');
            });
            if (screenId) {
                const target = document.getElementById(screenId);
                if (target) target.classList.remove('hidden');
            }
            setMenuScreenActive(screenId === 'home-screen');
        }

        // ---------------------------------------------------------
        // ESC中断処理 ＆ ホームへ戻る処理
        // ---------------------------------------------------------
        function showPopup(message, callback) {
            const overlay = document.getElementById('popup-overlay');
            const msg = document.getElementById('popup-message');
            const closeButton = document.getElementById('popup-close');
            if (!overlay || !msg || !closeButton) return;
            msg.innerText = message;
            overlay.classList.add('active');
            closeButton.onclick = () => {
                overlay.classList.remove('active');
                if (callback) callback();
            };
        }

        function abortAndReturnHome(reason) {
            if (reason) {
                showPopup(reason, () => location.reload());
            } else {
                location.reload();
            }
        }

        function broadcastAbort(playerName) {
            for (let cId in clients) {
                const c = clients[cId];
                if (c.dc.readyState === 'open') {
                    c.dc.send(JSON.stringify({ type: 'abort', playerName }));
                }
            }
        }

        function getRandomItemType() {
            const itemTypes = ['speed', 'shield', 'teleport'];
            return itemTypes[Math.floor(Math.random() * itemTypes.length)];
        }

        function spawnGameItem() {
            if (!currentStageData) return;
            const margin = 120;
            const x = margin + Math.random() * Math.max(0, currentStageData.w - margin * 2);
            const y = margin + Math.random() * Math.max(0, currentStageData.h - margin * 2);
            const type = getRandomItemType();
            gameState.items.push({ id: `item_${Date.now()}_${Math.random().toString(36).slice(2,8)}`, x, y, type });
        }

        function applyItemPickup(p, item) {
            if (!p || !item) return;
            if (item.type === 'speed') {
                p.speedBoostTime = 5;
            } else if (item.type === 'shield') {
                p.shieldTime = 5;
                p.invincible = Math.max(p.invincible, 5);
            } else if (item.type === 'teleport') {
                p.x = Math.min(Math.max(PLAYER_R, p.x + (Math.random() - 0.5) * 900), currentStageData.w - PLAYER_R);
                p.y = Math.min(Math.max(PLAYER_R, p.y + (Math.random() - 0.5) * 600), currentStageData.h - PLAYER_R);
                p.vx = 0;
                p.vy = 0;
            }
        }

        function initMenuParticles() {
            menuParticles = [];
            const count = 48;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 80 + Math.random() * 240;
                menuParticles.push({
                    x: menuWidth / 2 + Math.cos(angle) * radius,
                    y: menuHeight / 2 + Math.sin(angle) * radius,
                    vx: (Math.random() - 0.5) * 26,
                    vy: (Math.random() - 0.5) * 26,
                    size: 1.4 + Math.random() * 2.2,
                    hue: 170 + Math.random() * 120
                });
            }
        }

        function updateMenuCanvas(dt) {
            if (!menuCtx) return;
            const time = performance.now() / 1000;
            menuCtx.clearRect(0, 0, menuWidth, menuHeight);

            const grd = menuCtx.createLinearGradient(0, 0, menuWidth, menuHeight);
            grd.addColorStop(0, '#050a14');
            grd.addColorStop(0.4, '#071020');
            grd.addColorStop(1, '#02040b');
            menuCtx.fillStyle = grd;
            menuCtx.fillRect(0, 0, menuWidth, menuHeight);

            menuCtx.save();
            menuCtx.globalAlpha = 0.2;
            menuCtx.fillStyle = 'rgba(0, 255, 255, 0.08)';
            for (let i = 0; i < 6; i++) {
                const offset = (time * 30 + i * 110) % (menuWidth * 1.2) - menuWidth * 0.1;
                menuCtx.fillRect(offset, 0, 1.2, menuHeight);
            }
            menuCtx.restore();

            menuCtx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            menuCtx.lineWidth = 1;
            for (let x = 0; x <= menuWidth; x += 96) {
                menuCtx.beginPath();
                menuCtx.moveTo(x, 0);
                menuCtx.lineTo(x, menuHeight);
                menuCtx.stroke();
            }
            for (let y = 0; y <= menuHeight; y += 96) {
                menuCtx.beginPath();
                menuCtx.moveTo(0, y);
                menuCtx.lineTo(menuWidth, y);
                menuCtx.stroke();
            }

            menuCtx.save();
            menuCtx.strokeStyle = 'rgba(0, 255, 255, 0.08)';
            menuCtx.lineWidth = 1.5;
            menuCtx.setLineDash([6, 10]);
            menuCtx.beginPath();
            menuCtx.moveTo(0, menuHeight * 0.28);
            menuCtx.lineTo(menuWidth * 0.72, menuHeight * 0.72);
            menuCtx.stroke();
            menuCtx.restore();

            const dropCount = 24;
            for (let i = 0; i < dropCount; i++) {
                const x = (i + 0.4) * menuWidth / dropCount;
                const speed = 90 + (i % 5) * 9;
                const offset = ((time * speed) + i * 60) % (menuHeight * 1.4) - menuHeight * 0.2;
                menuCtx.fillStyle = 'rgba(0, 255, 255, 0.08)';
                menuCtx.fillRect(x, offset, 2, 110);
                menuCtx.fillStyle = 'rgba(255, 255, 255, 0.04)';
                menuCtx.fillRect(x + 4, offset + 24, 1, 48);
            }

            for (let p of menuParticles) {
                const dx = menuMouse.x - p.x;
                const dy = menuMouse.y - p.y;
                const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
                const attraction = Math.min(160, 2200 / (dist * dist));
                p.vx += dx / dist * attraction * dt * 0.01;
                p.vy += dy / dist * attraction * dt * 0.01;
                p.vx *= 0.94;
                p.vy *= 0.94;
                p.x += p.vx * dt;
                p.y += p.vy * dt;

                if (p.x < -24) p.x = menuWidth + 24;
                if (p.x > menuWidth + 24) p.x = -24;
                if (p.y < -24) p.y = menuHeight + 24;
                if (p.y > menuHeight + 24) p.y = -24;
            }

            menuCtx.strokeStyle = 'rgba(0, 255, 255, 0.16)';
            menuCtx.lineWidth = 1;
            for (let i = 0; i < menuParticles.length; i++) {
                for (let j = i + 1; j < menuParticles.length; j++) {
                    const a = menuParticles[i];
                    const b = menuParticles[j];
                    const dx = a.x - b.x;
                    const dy = a.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 110) {
                        menuCtx.globalAlpha = 0.12 - dist * 0.0009;
                        menuCtx.beginPath();
                        menuCtx.moveTo(a.x, a.y);
                        menuCtx.lineTo(b.x, b.y);
                        menuCtx.stroke();
                    }
                }
            }
            menuCtx.globalAlpha = 1;

            for (let p of menuParticles) {
                menuCtx.beginPath();
                menuCtx.fillStyle = `hsla(${p.hue}, 100%, 72%, 0.96)`;
                menuCtx.shadowColor = `hsla(${p.hue}, 100%, 80%, 0.35)`;
                menuCtx.shadowBlur = 18;
                menuCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                menuCtx.fill();
                menuCtx.shadowBlur = 0;
            }

            menuCtx.save();
            menuCtx.translate(menuWidth * 0.82, menuHeight * 0.18);
            const pulse = 1 + Math.sin(time * 2.5) * 0.05;
            menuCtx.beginPath();
            menuCtx.strokeStyle = 'rgba(0,255,255,0.18)';
            menuCtx.lineWidth = 3;
            menuCtx.arc(0, 0, 38 * pulse, 0, Math.PI * 2);
            menuCtx.stroke();
            menuCtx.strokeStyle = 'rgba(255, 0, 255, 0.12)';
            menuCtx.lineWidth = 2;
            menuCtx.arc(0, 0, 18 * pulse, 0, Math.PI * 2);
            menuCtx.stroke();
            menuCtx.restore();

            menuCtx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            menuCtx.font = '500 14px "Segoe UI", sans-serif';
            menuCtx.fillText('CYBER GRID ACTIVE', 24, 36);
            menuCtx.fillText('NODE ALIGNMENT STABLE', 24, 58);
            menuCtx.fillText('HOVER FOR FIELD RESPONSE', 24, 82);
        }

        function animateMenu(timestamp) {
            if (!menuFrameTime) menuFrameTime = timestamp;
            const dt = Math.min((timestamp - menuFrameTime) / 1000, 0.05);
            menuFrameTime = timestamp;
            updateMenuCanvas(dt);
            menuAnimationId = requestAnimationFrame(animateMenu);
        }

        document.getElementById('btn-create-room').addEventListener('click', async () => {
            roomId = document.getElementById('host-room-id').value.trim();
            if (!roomId) return showPopup("合言葉を入力してください");
            
            gameState.stageScale = parseFloat(document.getElementById('stage-size').value);
            gameState.timeSetting = parseInt(document.getElementById('game-time').value, 10);
            gameState.maxPlayers = parseInt(document.getElementById('max-players').value, 10);
            
            isHost = true; myPlayerId = 1;
            showScreen('lobby-screen');
            document.getElementById('btn-force-start').classList.remove('hidden');
            document.getElementById('lobby-msg').innerText = "参加者を待っています...";
            
            gameState.players[1] = createPlayerState(1, myNickname);
            gameState.rematchStatus[1] = false;
            gameState.status = 'lobby';
            updateLobbyUI();

            const roomRef = ref(db, `rooms/${roomId}`);
            await remove(roomRef); 

            onChildAdded(ref(db, `rooms/${roomId}/join_requests`), async (snap) => {
                if (gameState.status !== 'lobby') return; 
                if (Object.keys(clients).length + 1 >= gameState.maxPlayers) return; 
                
                const cId = snap.key;
                const pId = nextPlayerId++;
                
                const pc = new RTCPeerConnection(rtcConfig);
                const dc = pc.createDataChannel('gameData', { ordered: false, maxRetransmits: 0 });
                clients[cId] = { pc, dc, pId };
                
                gameState.players[pId] = createPlayerState(pId, "接続中...");
                gameState.rematchStatus[pId] = false;
                allKeys[pId] = { up: false, down: false, left: false, right: false };
                updateLobbyUI();

                setupHostDataChannel(cId, dc, pId);

                pc.onicecandidate = e => {
                    if (e.candidate) push(ref(db, `rooms/${roomId}/connections/${cId}/hostIce`), e.candidate.toJSON());
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await set(ref(db, `rooms/${roomId}/connections/${cId}/offer`), { type: offer.type, sdp: offer.sdp });

                onValue(ref(db, `rooms/${roomId}/connections/${cId}/answer`), async ansSnap => {
                    if (ansSnap.exists() && !pc.currentRemoteDescription) {
                        await pc.setRemoteDescription(new RTCSessionDescription(ansSnap.val()));
                    }
                });

                onChildAdded(ref(db, `rooms/${roomId}/connections/${cId}/clientIce`), iceSnap => {
                    if (iceSnap.val()) pc.addIceCandidate(new RTCIceCandidate(iceSnap.val()));
                });
            });

            if(!loopStarted) { loopStarted = true; lastTime = performance.now(); requestAnimationFrame(hostLoop); }
        });

        document.getElementById('btn-join-room').addEventListener('click', async () => {
            roomId = document.getElementById('client-room-id').value.trim();
            if (!roomId) return showPopup("合言葉を入力してください");
            
            isHost = false; 
            myClientId = Math.random().toString(36).substring(2, 10);
            showScreen('lobby-screen');
            document.getElementById('lobby-msg').innerText = "ホストと接続中...";

            await set(ref(db, `rooms/${roomId}/join_requests/${myClientId}`), true);

            onValue(ref(db, `rooms/${roomId}/connections/${myClientId}/offer`), async snap => {
                if (snap.exists() && !hostPc) {
                    hostPc = new RTCPeerConnection(rtcConfig);
                    hostPc.ondatachannel = e => { hostDc = e.channel; setupClientDataChannel(); };
                    
                    hostPc.onicecandidate = e => {
                        if (e.candidate) push(ref(db, `rooms/${roomId}/connections/${myClientId}/clientIce`), e.candidate.toJSON());
                    };

                    await hostPc.setRemoteDescription(new RTCSessionDescription(snap.val()));
                    const answer = await hostPc.createAnswer();
                    await hostPc.setLocalDescription(answer);
                    await set(ref(db, `rooms/${roomId}/connections/${myClientId}/answer`), { type: answer.type, sdp: answer.sdp });

                    onChildAdded(ref(db, `rooms/${roomId}/connections/${myClientId}/hostIce`), iceSnap => {
                        if (iceSnap.val()) hostPc.addIceCandidate(new RTCIceCandidate(iceSnap.val()));
                    });
                }
            });

            if(!loopStarted) { loopStarted = true; requestAnimationFrame(clientLoop); }
        });

        function setupHostDataChannel(cId, dc, pId) {
            dc.onopen = () => { console.log(`Client ${pId} connected.`); };
            dc.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'join_info') {
                    gameState.players[pId].name = data.name;
                    checkLobbyAutoStart(); 
                }
                if (data.type === 'input') allKeys[pId] = data.keys;
                if (data.type === 'vote_stage') {
                    gameState.stageVotes[pId] = data.stageId;
                    checkStageVotes();
                }
                if (data.type === 'rematch_ready') {
                    gameState.rematchStatus[pId] = true;
                }
                if (data.type === 'abort') {
                    broadcastAbort(data.playerName);
                    abortAndReturnHome(`${data.playerName} によってゲームが中断されました。`);
                }
            };
            dc.onclose = () => { 
                if(gameState.players[pId]) gameState.players[pId].active = false; 
                updateLobbyUI(); 
            };
        }

        function setupClientDataChannel() {
            hostDc.onopen = () => {
                document.getElementById('lobby-msg').innerText = "ホストの操作を待っています...";
                hostDc.send(JSON.stringify({ type: 'join_info', name: myNickname }));
            };
            hostDc.onmessage = (e) => {
                const data = JSON.parse(e.data);
                
                if (data.frameId !== undefined) {
                    if (data.frameId < lastReceivedFrameId) return; 
                    lastReceivedFrameId = data.frameId;
                }

                if (data.type === 'state') {
                    gameState = data.state;
                    if (myPlayerId === null && data.assignId) myPlayerId = data.assignId;
                    processClientStateChange();
                } 
                else if (data.type === 'game_start') {
                    applyGameStartData(data.stageId, data.oniId, data.spawnData, data.stageScale);
                }
                else if (data.type === 'abort') {
                    abortAndReturnHome(`${data.playerName} によってゲームが中断されました。`);
                }
            };
            hostPc.oniceconnectionstatechange = () => {
                if (hostPc.iceConnectionState === 'disconnected' || hostPc.iceConnectionState === 'failed') {
                    abortAndReturnHome("通信が切断されました。");
                }
            };
        }

        function createPlayerState(id, name) {
            return { 
                name: name, x: undefined, y: undefined, vx: 0, vy: 0, color: PLAYER_COLORS[id], 
                active: true, invincible: 0, warpCooldown: 0, 
                isGrounded: false, prevUp: false, onSlope: null, onMovingBlock: null,
                doubleJumpAvailable: true, doubleJumpCooldown: 0,
                speedBoostTime: 0, shieldTime: 0
            };
        }

        // ---------------------------------------------------------
        // 2. 画面遷移ロジック と UI同期
        // ---------------------------------------------------------
        function updateLobbyUI() {
            const activePlayers = Object.values(gameState.players).filter(p => p.active);
            const activeCount = activePlayers.length;
            document.getElementById('lobby-status').innerText = `参加者: ${activeCount} / ${gameState.maxPlayers} 人`;

            const names = activePlayers.map(p => p.name || '名無し');
            const waitingText = names.length === 0
                ? '参加者を待っています...'
                : names.length === 1
                    ? `${names[0]} が待機中`
                    : `${names.slice(0, -1).join('、')} と ${names.slice(-1)[0]} が待機中`;
            document.getElementById('lobby-msg').innerText = waitingText;

            if (isHost && gameState.status === 'lobby') {

                    btn.innerText = "ステージ投票へ進む";

                    btn.disabled = true;
                    btn.innerText = "2人以上で開始可能";
                }

        }

        function checkLobbyAutoStart() {
            if (!isHost || gameState.status !== 'lobby') return;
            updateLobbyUI();
            const activeCount = Object.values(gameState.players).filter(p => p.active).length;
            if (activeCount >= gameState.maxPlayers) {
                startStageSelect();
            }
        }

        let currentScreen = 'home';
        function processClientStateChange() {
            // ステージデータが未生成またはスケールが変わっている場合は再構築（途中参加対策）
            if (gameState.status === 'countdown' || gameState.status === 'playing' || gameState.status === 'result') {
                if (!currentStageData || currentStageData.id !== gameState.stageId || currentStageData.scale !== gameState.stageScale) {
                    currentStageData = getScaledStage(STAGES[gameState.stageId], gameState.stageScale);
                    currentStageData.scale = gameState.stageScale; // キャッシュ判定用
                }

                let isSafeToDraw = true;
                for (let id in gameState.players) {
                    if (gameState.players[id].active && gameState.players[id].x === undefined) {
                        isSafeToDraw = false;
                    }
                }
                isGameReady = isSafeToDraw;
            } else {
                isGameReady = false;
            }

            if (gameState.status !== currentScreen) {
                currentScreen = gameState.status;
                showScreen(null); 
                document.getElementById('hud').classList.add('hidden');

                if (currentScreen === 'home') showScreen('home-screen');
                else if (currentScreen === 'lobby') { showScreen('lobby-screen'); updateLobbyUI(); }
                else if (currentScreen === 'stageSelect') { showScreen('stage-screen'); buildStageGrid(); }
                else if (currentScreen === 'countdown' || currentScreen === 'playing') {
                    document.getElementById('hud').classList.remove('hidden');
                } 
                else if (currentScreen === 'result') {
                    showScreen('result-screen');
                    document.getElementById('btn-ready').classList.remove('hidden');
                    document.getElementById('rematch-status').innerText = "";
                    
                    let resultMsg = "";
                    const oniName = gameState.players[gameState.winnerId]?.name || "不明";
                    const outcomeEl = document.getElementById('result-outcome');
                    if (gameState.winnerId === myPlayerId) {
                        resultMsg = `敗北(鬼): ${oniName} 💀<br>あなたは逃げ切れなかった...`;
                        document.getElementById('result-desc').style.color = "var(--danger)";
                        if (outcomeEl) {
                            outcomeEl.innerText = 'LOSE';
                            outcomeEl.style.color = '#ff6377';
                            outcomeEl.style.textShadow = '0 0 28px rgba(255,99,119,0.55), 0 0 68px rgba(255, 20, 160, 0.18)';
                        }
                    } else {
                        resultMsg = `敗北(鬼): ${oniName} 💀<br>あなたは逃げ切りました！🎉`;
                        document.getElementById('result-desc').style.color = "var(--primary)";
                        if (outcomeEl) {
                            outcomeEl.innerText = 'WIN';
                            outcomeEl.style.color = '#7cff6a';
                            outcomeEl.style.textShadow = '0 0 28px rgba(124,255,106,0.55), 0 0 68px rgba(0, 255, 255, 0.18)';
                        }
                    }
                    document.getElementById('result-desc').innerHTML = resultMsg;
                }
            }

            if (currentScreen === 'result') {
                let readyCount = 0;
                let totalActive = 0;
                let amIReady = false;
                for(let id in gameState.players) {
                    if (gameState.players[id].active) {
                        totalActive++;
                        if(gameState.rematchStatus[id]) readyCount++;
                        if(parseInt(id) === myPlayerId && gameState.rematchStatus[id]) amIReady = true;
                    }
                }
                const statusEl = document.getElementById('rematch-status');
                if(amIReady) {
                    statusEl.innerText = `再戦準備: ${readyCount} / ${totalActive} 人`;
                    document.getElementById('btn-ready').classList.add('hidden');
                } else {
                    statusEl.innerText = `みんなが準備OKを押したら再度プレイされます\n(現在: ${readyCount} / ${totalActive} 人)`;
                    document.getElementById('btn-ready').classList.remove('hidden');
                }

                if (isHost && totalActive > 0 && readyCount === totalActive) {
                    startStageSelect();
                }
            }
        }

        document.getElementById('btn-force-start').addEventListener('click', () => {
            const activeCount = Object.values(gameState.players).filter(p => p.active).length;
            if (activeCount < 2) return;
            startStageSelect();
        });

        let isStageGridBuilt = false;
        function buildStageGrid() {
            if (isStageGridBuilt) return;
            const grid = document.getElementById('stage-grid');
            grid.innerHTML = '';
            document.getElementById('stage-msg').innerText = "好きなステージを選んでください！";
            
            STAGES.forEach(st => {
                const card = document.createElement('div');

                card.onclick = () => submitStageVote(st.id);

                voteArea.id = `vote-area-${st.id}`;

                card.appendChild(title);
                card.appendChild(voteArea);

        function submitStageVote(stageId) {
            if (isHost) {
                gameState.stageVotes[myPlayerId] = stageId;
                checkStageVotes();
            } else {
                if (hostDc && hostDc.readyState === 'open') {
                    hostDc.send(JSON.stringify({ type: 'vote_stage', stageId: stageId }));
                }
            }

        function updateStageGridUI() {
            if (gameState.status !== 'stageSelect') return;
            
            STAGES.forEach(st => {
                const area = document.getElementById(`vote-area-${st.id}`);
                if (area) area.innerHTML = '';
            });
            
            let myVoted = false;
            for (let pId in gameState.stageVotes) {
                const sId = gameState.stageVotes[pId];
                const area = document.getElementById(`vote-area-${sId}`);
                if (area && gameState.players[pId]) {
                    const dot = document.createElement('div');
                    dot.className = 'vote-dot';
                    dot.style.backgroundColor = gameState.players[pId].color;
                    dot.title = gameState.players[pId].name;
                    area.appendChild(dot);
                }
                if (parseInt(pId) === myPlayerId) myVoted = true;
            }
            
            const msgEl = document.getElementById('stage-msg');
            if (myVoted) {
                msgEl.innerText = "他のプレイヤーの投票を待っています...";

                msgEl.innerText = "好きなステージを選んでください！";
