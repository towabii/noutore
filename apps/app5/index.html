<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Style - Final</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Arial', sans-serif;
            user-select: none; /* テキスト選択防止 */
        }
        canvas {
            display: block;
        }
        /* UIレイヤー */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* ゲームプレイ中はクリックを透過 */
        }
        
        /* 左上：現在の進捗 */
        #current-progress {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 2px 2px 0 #000;
        }

        /* 右上：ハイスコア */
        #high-score {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffff00;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 2px 2px 0 #000;
        }

        /* 中央メッセージ（死亡/クリア） */
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            display: none;
            text-shadow: 0 0 15px #000, 0 0 5px #000;
            z-index: 10;
        }

        /* メニュー画面（レベル選択） */
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto; /* メニューはクリック可能 */
            z-index: 20;
        }
        
        h1 {
            color: #fff;
            text-shadow: 0 0 10px #0ff;
            font-size: 60px;
            margin-bottom: 40px;
            font-style: italic;
        }

        .level-btn {
            background: linear-gradient(to bottom, #444, #222);
            color: white;
            border: 2px solid #fff;
            padding: 15px 40px;
            margin: 10px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            width: 300px;
            text-align: center;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }
        .level-btn:hover {
            background: linear-gradient(to bottom, #666, #444);
            transform: scale(1.05);
        }
        .level-btn:active {
            transform: scale(0.95);
        }

        /* 難易度別の色 */
        #btn-lvl1 { border-color: #00ff00; color: #00ff00; }
        #btn-lvl2 { border-color: #ffff00; color: #ffff00; }
        #btn-lvl3 { border-color: #ff0000; color: #ff0000; }

    </style>
</head>
<body>
    <!-- キャンバス -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI要素 -->
    <div id="ui-layer">
        <div id="current-progress">PROGRESS: 0%</div>
        <div id="high-score">BEST: 0%</div>
        <div id="message">
            CRASHED!<br>
            <span style="font-size: 20px">Press SPACE to Restart</span>
        </div>
    </div>

    <!-- メニュー画面 -->
    <div id="menu-screen">
        <h1>GEOMETRY JUMP</h1>
        <div class="level-btn" id="btn-lvl1" onclick="startGame(1)">LEVEL 1: EASY</div>
        <div class="level-btn" id="btn-lvl2" onclick="startGame(2)">LEVEL 2: NORMAL</div>
        <div class="level-btn" id="btn-lvl3" onclick="startGame(3)">LEVEL 3: HARD</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- ゲーム設定 ---
        const TILE_SIZE = 60;
        const GRAVITY = 0.9;
        // ジャンプ力を 0.5 強化 (-16.0 -> -16.5)
        const JUMP_FORCE = -16.5; 
        const SPEED = 9;
        const BG_COLOR = '#202028';

        // --- レベルデータ ---
        // 空白: 道, #: ブロック, ^: トゲ, G: ゴール
        const LEVELS = {
            1: [ // Easy: 平坦で短い、練習用
                "                                                                                                     G",
                "                                                                                                     #",
                "                                                  ###                                                #",
                "                                                 ####                                                #",
                "                        ^         ^   ^         #####       ^        ###         ^          ###      #",
                "######################################################################################################"
            ],
            2: [ // Normal: 階段や少し長い穴、2連トゲ
                "                                                                                                                                                           G",
                "                                                                                                                                                           #",
                "                                                                                       ###                                                                 #",
                "                                                                    ###               ####                   ###                                           #",
                "                                          ###                      ####      ^   ^   #####        ^  ^      ####                  ^                        #",
                "                   ###        ^  ^       ####        ^            #####     ### ### ######       ### ###   #####      ###        ###          ###          #",
                "############################################################################################################################################################"
            ],
            3: [ // Hard: テクニカルな配置
                "                                                                                                                                                                                           G",
                "                                                                                                                                                                                           #",
                "                                                                                                             ###                                   ###                                     #",
                "                                                                                        ###                 ####                                  ####                                     #",
                "                                                     ###                               ####     ^  ^       #####                  ###      ^     #####               ^                     #",
                "                                       ###          ####        ^ ^          ###      #####    ### ###    ######      ^          ####     ###   ######      ^       ###   ^               #",
                "                  ^    ^      ###     ####    ^    #####       #####  ^     #####    ######    #######   #######     ###   ^    #####     ###  #######     ###     ##### ###               #",
                "############################################################################################################################################################################################"
            ]
        };

        // --- グローバル変数 ---
        let currentLevel = 1;
        let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER, CLEARED
        
        let player = {
            x: 0, y: 0, w: TILE_SIZE - 10, h: TILE_SIZE - 10,
            dy: 0, angle: 0, isGrounded: false, dead: false,
            prevY: 0 // 判定修正用：1フレーム前のY座標
        };

        let camera = { x: 0 };
        let blocks = [];
        let mapWidth = 0;
        let particles = [];
        let animationId;

        // --- 画面リサイズ ---
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- ハイスコア管理 ---
        function getHighScore(level) {
            return localStorage.getItem('gd_highscore_' + level) || 0;
        }
        function saveHighScore(level, score) {
            const current = getHighScore(level);
            if (score > current) {
                localStorage.setItem('gd_highscore_' + level, score);
                return true;
            }
            return false;
        }
        function updateScoreUI(progress) {
            document.getElementById('current-progress').innerText = `PROGRESS: ${progress}%`;
            document.getElementById('high-score').innerText = `BEST: ${getHighScore(currentLevel)}%`;
        }

        // --- ゲーム開始処理 ---
        function startGame(levelIndex) {
            currentLevel = levelIndex;
            gameState = 'PLAYING';
            
            // UI切り替え
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('message').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'block';
            
            resetLevel();
            updateScoreUI(0);
            
            if (animationId) cancelAnimationFrame(animationId);
            loop();
        }

        function resetLevel() {
            blocks = [];
            const levelMap = LEVELS[currentLevel];
            const rows = levelMap.length;
            const cols = levelMap[0].length;
            mapWidth = cols * TILE_SIZE;

            // 下端合わせで配置
            const startY = canvas.height - (rows * TILE_SIZE);

            for (let r = 0; r < rows; r++) {
                const rowStr = levelMap[r];
                for (let c = 0; c < rowStr.length; c++) {
                    const char = rowStr[c];
                    const x = c * TILE_SIZE;
                    const y = startY + (r * TILE_SIZE);

                    if (char === '#') {
                        blocks.push({ x: x, y: y, w: TILE_SIZE, h: TILE_SIZE, type: 'BLOCK' });
                    } else if (char === '^') {
                        // トゲ
                        blocks.push({ 
                            x: x + 12, y: y + 12, w: TILE_SIZE - 24, h: TILE_SIZE - 12, 
                            type: 'SPIKE', drawX: x, drawY: y 
                        });
                    } else if (char === 'G') {
                        blocks.push({ x: x, y: y - TILE_SIZE * 10, w: TILE_SIZE, h: TILE_SIZE * 20, type: 'GOAL' });
                    }
                }
            }

            // プレイヤー初期化
            player.x = 100;
            player.y = startY + (rows - 3) * TILE_SIZE;
            player.prevY = player.y;
            player.dy = 0;
            player.angle = 0;
            player.dead = false;
            player.isGrounded = false;
            
            camera.x = 0;
            particles = [];
        }

        // --- ゲームロジック ---
        function update() {
            if (gameState !== 'PLAYING') return;
            if (player.dead) return;

            // 1. 移動前の座標を保存（重要：これが判定修正の鍵）
            player.prevY = player.y;

            // 2. 横移動
            player.x += SPEED;

            // 3. 重力と縦移動
            player.dy += GRAVITY;
            player.y += player.dy;
            player.isGrounded = false;

            // 4. 画面外落下
            if (player.y > canvas.height) {
                die();
                return;
            }

            // 5. 当たり判定
            checkCollisions();

            // 6. 回転
            if (!player.isGrounded) {
                player.angle += 0.15;
            } else {
                // 接地時は回転をスナップ
                player.angle = Math.round(player.angle / (Math.PI/2)) * (Math.PI/2);
            }

            // 7. カメラ
            camera.x = player.x - 200;

            // 8. 進捗更新
            const progress = Math.min(100, Math.floor((player.x / mapWidth) * 100));
            updateScoreUI(progress);
        }

        function checkCollisions() {
            // プレイヤーのバウンディングボックス（少しマージンを持たせる）
            const pLeft = player.x + 5;
            const pRight = player.x + player.w - 5;
            const pTop = player.y;
            const pBottom = player.y + player.h;

            for (let b of blocks) {
                // 画面外カリング
                if (b.x > player.x + canvas.width || b.x + b.w < player.x - 100) continue;

                // AABB交差判定
                if (pRight > b.x && pLeft < b.x + b.w &&
                    pBottom > b.y && pTop < b.y + b.h) {
                    
                    if (b.type === 'SPIKE') {
                        die();
                        return;
                    } else if (b.type === 'GOAL') {
                        levelClear();
                        return;
                    } else if (b.type === 'BLOCK') {
                        // --- 判定修正のキモ ---
                        // 「今回のフレームでめり込んだ」としても、
                        // 「1フレーム前はブロックの上にいた」かつ「落下中(dy >= 0)」なら
                        // それは着地であるとみなす。
                        const wasAbove = (player.prevY + player.h) <= b.y + 15; // +15は許容誤差
                        const isFalling = player.dy >= 0;

                        if (wasAbove && isFalling) {
                            // 着地処理
                            player.y = b.y - player.h;
                            player.dy = 0;
                            player.isGrounded = true;
                        } else {
                            // それ以外は横や下からの衝突＝死亡
                            die();
                            return;
                        }
                    }
                }
            }
        }

        function die() {
            if (player.dead) return;
            player.dead = true;
            gameState = 'GAMEOVER';
            
            // 進捗保存
            const progress = Math.min(100, Math.floor((player.x / mapWidth) * 100));
            saveHighScore(currentLevel, progress);
            updateScoreUI(progress);

            // 爆発エフェクト
            for(let i=0; i<30; i++) {
                particles.push({
                    x: player.x + player.w/2,
                    y: player.y + player.h/2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 1.0,
                    color: `hsl(${Math.random()*360}, 100%, 50%)`
                });
            }

            const msg = document.getElementById('message');
            msg.innerHTML = `CRASHED!<br><span style='font-size:20px'>Press SPACE to Restart</span>`;
            msg.style.display = 'block';
        }

        function levelClear() {
            player.dead = true; // 操作不能にする
            gameState = 'CLEARED';
            saveHighScore(currentLevel, 100);
            updateScoreUI(100);

            const msg = document.getElementById('message');
            msg.innerHTML = `LEVEL COMPLETE!<br><span style='font-size:20px'>Press ESC for Menu / SPACE to Replay</span>`;
            msg.style.display = 'block';
        }

        // --- 描画処理 ---
        function draw() {
            // 背景
            ctx.fillStyle = BG_COLOR;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 背景グリッド（パララックス）
            ctx.save();
            ctx.translate(-camera.x * 0.3, 0); 
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 2;
            const gridSize = 100;
            const startX = Math.floor(camera.x * 0.3 / gridSize) * gridSize;
            for (let x = startX; x < startX + canvas.width + gridSize; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            ctx.restore();

            // カメラ適用
            ctx.save();
            ctx.translate(-camera.x, 0);

            // ブロック
            for (let b of blocks) {
                if (b.x + b.w < camera.x || b.x > camera.x + canvas.width) continue;

                if (b.type === 'BLOCK') {
                    ctx.fillStyle = 'black';
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.strokeStyle = '#00ffcc';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(b.x, b.y, b.w, b.h);
                    ctx.fillStyle = 'rgba(0, 255, 204, 0.2)';
                    ctx.fillRect(b.x+5, b.y+5, b.w-10, b.h-10);
                } else if (b.type === 'SPIKE') {
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.moveTo(b.drawX, b.drawY + TILE_SIZE);
                    ctx.lineTo(b.drawX + TILE_SIZE/2, b.drawY);
                    ctx.lineTo(b.drawX + TILE_SIZE, b.drawY + TILE_SIZE);
                    ctx.fill();
                    ctx.strokeStyle = 'red';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                    ctx.beginPath();
                    ctx.moveTo(b.drawX + 15, b.drawY + TILE_SIZE - 5);
                    ctx.lineTo(b.drawX + TILE_SIZE/2, b.drawY + 15);
                    ctx.lineTo(b.drawX + TILE_SIZE - 15, b.drawY + TILE_SIZE - 5);
                    ctx.fill();
                } else if (b.type === 'GOAL') {
                    ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
                    ctx.fillRect(b.x, 0, 50, canvas.height);
                    ctx.fillStyle = '#fff';
                    ctx.fillText("G", b.x + 10, canvas.height/2);
                }
            }

            // プレイヤー
            if (!player.dead || gameState === 'CLEARED') {
                ctx.save();
                ctx.translate(player.x + player.w/2, player.y + player.h/2);
                ctx.rotate(player.angle);
                
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffff00';
                ctx.fillStyle = '#ffff00'; 
                ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 3;
                ctx.strokeRect(-player.w/2, -player.h/2, player.w, player.h);
                
                // 顔
                ctx.fillStyle = 'black';
                ctx.fillRect(4, -8, 10, 10);
                ctx.fillRect(4, 8, 10, 10);
                ctx.restore();
            }

            // パーティクル
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if(p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 8, 8);
                ctx.globalAlpha = 1.0;
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            animationId = requestAnimationFrame(loop);
        }

        // --- 入力 ---
        function jump() {
            if (gameState === 'MENU') return; // メニュー中はジャンプしない

            if (gameState === 'GAMEOVER' || gameState === 'CLEARED') {
                // スペースキーでリスタート
                gameState = 'PLAYING';
                document.getElementById('message').style.display = 'none';
                resetLevel();
                updateScoreUI(0);
            } else {
                if (player.isGrounded) {
                    player.dy = JUMP_FORCE;
                    player.isGrounded = false;
                }
            }
        }

        function backToMenu() {
            gameState = 'MENU';
            document.getElementById('menu-screen').style.display = 'flex';
            document.getElementById('ui-layer').style.display = 'none';
        }

        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') jump();
            if (e.code === 'Escape') backToMenu();
        });
        window.addEventListener('mousedown', (e) => {
            // メニュー画面でのクリックはボタンに任せる
            if (gameState === 'MENU') return;
            jump();
        });
        window.addEventListener('touchstart', (e) => {
            if (gameState === 'MENU') return;
            e.preventDefault();
            jump();
        }, {passive: false});

        // 初回はメニューを表示したまま待機（描画ループだけ回す）
        loop();

    </script>
</body>
</html>
