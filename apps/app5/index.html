<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Site Selection</title>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-color: #ffffff;
            --accent-a: #e63946; /* 赤 */
            --accent-b: #2a9d8f; /* 緑 */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 雪のエフェクト */
        .snow {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(4px 4px at 100px 50px, #fff, transparent), 
                radial-gradient(6px 6px at 200px 150px, #fff, transparent), 
                radial-gradient(3px 3px at 300px 250px, #fff, transparent);
            background-size: 650px 650px;
            animation: snow 10s linear infinite;
            opacity: 0.3;
        }
        @keyframes snow { 
            0% { background-position: 0 0, 0 0, 0 0; } 
            100% { background-position: 50px 650px, 100px 650px, 150px 650px; } 
        }

        .container {
            width: 90%;
            max-width: 1200px;
            z-index: 10;
            text-align: center;
        }

        #main-question {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            font-family: 'Mochiy Pop One', sans-serif;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .options-wrapper {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        /* カード共通スタイル */
        .choice-card {
            flex: 1;
            max-width: 450px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            text-decoration: none; /* リンクの下線を消す */
            color: var(--text-color);
        }

        .choice-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.1);
        }

        /* 選択肢A */
        .card-a:hover {
            border-color: var(--accent-a);
            box-shadow: 0 0 30px rgba(230, 57, 70, 0.4);
        }
        .card-a h2 { color: var(--accent-a); }

        /* 選択肢B */
        .card-b:hover {
            border-color: var(--accent-b);
            box-shadow: 0 0 30px rgba(42, 157, 143, 0.4);
        }
        .card-b h2 { color: var(--accent-b); }

        .card-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-family: 'Mochiy Pop One', sans-serif;
        }

        .card-desc {
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0.9;
        }

        /* クリック時の波紋エフェクト */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.6s linear;
            background-color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        @media (max-width: 768px) {
            .options-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            .choice-card { width: 100%; min-height: 200px; }
            #main-question { font-size: 1.8rem; margin-bottom: 2rem; }
        }
    </style>
</head>
<body>
    <div class="snow"></div>

    <div class="container">
        <h1 id="main-question"></h1>

        <div class="options-wrapper">
            <!-- 選択肢A -->
            <div class="choice-card card-a" id="btn-a" onclick="jumpTo('A')">
                <h2 class="card-title" id="title-a"></h2>
                <p class="card-desc" id="desc-a"></p>
            </div>

            <!-- 選択肢B -->
            <div class="choice-card card-b" id="btn-b" onclick="jumpTo('B')">
                <h2 class="card-title" id="title-b"></h2>
                <p class="card-desc" id="desc-b"></p>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ▼▼▼ 設定エリア ▼▼▼
        // 文字と、飛ばしたいURLをここで設定してください
        // ==========================================
        const setting = {
            question: "どっちのデザインを見る？",
            
            optionA: {
                title: "キャンペーン特化型",
                desc: "にぎやかな演出のLP案を確認する",
                url: "https://www.google.com" // ★ここにA案のURLを入れる
            },

            optionB: {
                title: "ブランド世界観型",
                desc: "落ち着いた雰囲気のLP案を確認する",
                url: "https://www.yahoo.co.jp"  // ★ここにB案のURLを入れる
            }
        };
        // ==========================================

        // 画面の文字をセット
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('main-question').innerHTML = setting.question;
            
            document.getElementById('title-a').innerHTML = setting.optionA.title;
            document.getElementById('desc-a').innerHTML = setting.optionA.desc;
            
            document.getElementById('title-b').innerHTML = setting.optionB.title;
            document.getElementById('desc-b').innerHTML = setting.optionB.desc;
        });

        // クリック時の移動処理
        function jumpTo(type) {
            const url = type === 'A' ? setting.optionA.url : setting.optionB.url;
            
            // 演出（キラキラ）を出してから移動
            sparkle();
            
            // 0.3秒だけ待ってから移動（演出を見せるため）
            setTimeout(() => {
                window.location.href = url;
            }, 300);
        }

        // クリック時のキラキラエフェクト
        function sparkle() {
            const colors = ['#fff', '#gold'];
            for(let i=0; i<30; i++) {
                const p = document.createElement('div');
                p.style.position = 'fixed';
                p.style.left = '50%';
                p.style.top = '50%';
                p.style.width = Math.random() * 10 + 'px';
                p.style.height = p.style.width;
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.borderRadius = '50%';
                p.style.zIndex = '100';
                p.style.pointerEvents = 'none';
                document.body.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 300 + 50;
                
                p.animate([
                    { transform: 'translate(0,0)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`, opacity: 0 }
                ], {
                    duration: 500,
                    easing: 'ease-out'
                }).onfinish = () => p.remove();
            }
        }
    </script>
</body>
</html>
