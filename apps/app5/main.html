<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジオメタリートレーニング</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- 早期アクセス警告画面 -->
    <div id="splash-screen">
        <h1>早期アクセスバージョン</h1>
        <p>このゲームは開発中のため、<br>予期せぬバグや動作不良が含まれている可能性があります。</p>
        <p style="margin-top: 20px; font-size: 14px; color: #888;">起動中...</p>
    </div>

    <!-- ゲームUI -->
    <div id="ui-layer">
        <div id="current-progress" class="hud-text">0%</div>
        <div id="high-score" class="hud-text">自己ベスト: 0%</div>
        <div id="level-indicator" class="hud-text">レベル 1</div>
        <div id="message"></div>
    </div>

    <!-- メニュー画面 -->
    <div id="menu-screen">
        <h1>ジオメタリー<br>トレーニング</h1>
        <div class="level-container">
            <div class="level-btn" id="btn-lvl1" onclick="initGame(1)">
                レベル 1
                <span class="sub-text">難易度: 低</span>
            </div>
            <div class="level-btn" id="btn-lvl2" onclick="initGame(2)">
                レベル 2
                <span class="sub-text">難易度: 中</span>
            </div>
            <div class="level-btn" id="btn-lvl3" onclick="initGame(3)">
                レベル 3
                <span class="sub-text">難易度: 高</span>
            </div>
        </div>
        <p class="instructions">スペースキー / クリック : ジャンプ (長押しで飛行)<br>ESCキー : メニューに戻る</p>
    </div>

    <script src="levels.js"></script>
    <script src="script.js"></script>
</body>
</html>
