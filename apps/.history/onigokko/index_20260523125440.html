<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Player Tag - ハイスピード2D鬼ごっこ</title>
    <style>
        /* モダン＆ダークテーマのCSS */
        :root {
            --bg-color: #0b0c10;
            --primary: #45f3ff;
            --primary-glow: #45f3ff88;
            --danger: #ff2a5f;
            --danger-glow: #ff2a5f88;
            --platform: #1f2833;
            --platform-top: #38fc9d;
            --text: #c5c6c7;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            user-select: none;
        }

        #game-container {
            position: relative; width: 900px; height: 500px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            border-radius: 8px; overflow: hidden; background: #08090b;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* UIオーバーレイ */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 12, 16, 0.85); backdrop-filter: blur(5px);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
        }
        
        .hidden { display: none !important; }

        h1 { margin-bottom: 20px; font-size: 3rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px var(--danger-glow); color: #fff;}
        p.subtitle { margin-top: 0; margin-bottom: 30px; color: #888; }
        
        .input-group { display: flex; flex-direction: column; gap: 15px; width: 320px; }
        input {
            padding: 14px; border: 2px solid #333; border-radius: 6px;
            background: #111; color: #fff; font-size: 1.1rem;
            outline: none; text-align: center; transition: 0.2s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }

        button {
            padding: 14px 20px; border: none; border-radius: 6px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-host { background: var(--danger); color: #fff; box-shadow: 0 4px 15px var(--danger-glow); }
        .btn-host:hover { background: #ff4a78; transform: translateY(-2px); }
        .btn-client { background: var(--primary); color: #000; box-shadow: 0 4px 15px var(--primary-glow); }
        .btn-client:hover { background: #75f5ff; transform: translateY(-2px); }

        /* HUD */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 15px 25px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 5;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.7); padding: 10px 25px;
            border-radius: 8px; border: 1px solid #333;
            font-size: 1.3rem; font-weight: bold; color: #fff;
        }
        .text-oni { color: var(--danger); text-shadow: 0 0 8px var(--danger); }
        .text-nige { color: var(--primary); text-shadow: 0 0 8px var(--primary); }

        /* リザルト画面 */
        #result-title { font-size: 3.5rem; margin-bottom: 10px; color: #fff; }
        #result-desc { font-size: 1.5rem; margin-bottom: 30px; font-weight: bold; }
        
        #status-msg { margin-top: 20px; font-size: 1rem; color: #aaa; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas -->
        <canvas id="gameCanvas" width="900" height="500"></canvas>

        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="hud-box" id="role-display">役割: <span id="role-text">---</span></div>
            <div class="hud-box">残り時間: <span id="time-display">30</span>秒</div>
        </div>

        <!-- タイトル画面 -->
        <div id="title-screen" class="overlay">
            <h1>2 Player Tag</h1>
            <p class="subtitle">ハイスピード 2D 鬼ごっこ</p>
            <div class="input-group">
                <input type="text" id="room-id" placeholder="合言葉を入力 (例: tag123)" autocomplete="off">
                <button class="btn-host" id="btn-create">部屋を作成 (ホスト)</button>
                <button class="btn-client" id="btn-join">部屋に参加 (クライアント)</button>
            </div>
            <div id="status-msg"></div>
        </div>

        <!-- リザルト画面 -->
        <div id="result-screen" class="overlay hidden">
            <h1 id="result-title">TIME UP!</h1>
            <div id="result-desc">勝者: ---</div>
            <button class="btn-client" id="btn-rematch">もう一度プレイ</button>
            <div id="rematch-status" style="margin-top: 15px; font-size: 1rem; color: #aaa;"></div>
        </div>
    </div>

    <script type="module">
        // ---------------------------------------------------------
        // 1. Firebaseの初期化 (ユーザー環境に合わせて書き換えてください)
        // ---------------------------------------------------------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, get, onValue, off, remove, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // ※ プレースホルダー：ご自身のプロジェクトのConfigに書き換えてください
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ---------------------------------------------------------
        // 2. WebRTC & システム定数
        // ---------------------------------------------------------
        const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
        let pc, dc;
        let isHost = false;
        let myPlayerId = 1; // 1:Host(P1), 2:Client(P2)
        let roomId = "";
        let iceQueue = [];

        // ステージとキャンバスの定数
        const STAGE_W = 2000, STAGE_H = 1200;
        const CANVAS_W = 900, CANVAS_H = 500;

        // ---------------------------------------------------------
        // 3. ゲーム物理とステージデータ (2 Player Tag 仕様)
        // ---------------------------------------------------------
        const P_SIZE = 40; // プレイヤーのサイズ(四角形)
        const GRAVITY = 2800; // 重力
        const JUMP_FORCE = -1100; // ジャンプ力
        const ACCEL = 3500; // 移動の加速度
        const MAX_SPEED_NIGE = 600; // 逃げの最高速度
        const MAX_SPEED_ONI = 650;  // 鬼の最高速度 (少し速い)
        const MAX_FALL_SPEED = 1400; // 落下の終端速度
        const FRICTION_GROUND = 0.82; // 地上での摩擦(滑りやすさ)
        const FRICTION_AIR = 0.96;    // 空中での摩擦

        // ステージ上のブロック配置 (oneWay: true は下からすり抜け可能)
        const platforms = [
            // 一番下の底面 (落ちないようにする固定床)
            { x: 0, y: 1150, w: STAGE_W, h: 50, oneWay: false },
            // 中央の完全な障害物壁 (ソリッド)
            { x: 950, y: 800, w: 100, h: 350, oneWay: false },
            
            // 以下は空中のすり抜け床 (ジャンプで上に乗れる、下から抜けられる)
            { x: 200, y: 950, w: 400, h: 25, oneWay: true },
            { x: 1400, y: 950, w: 400, h: 25, oneWay: true },
            { x: 100, y: 700, w: 300, h: 25, oneWay: true },
            { x: 1600, y: 700, w: 300, h: 25, oneWay: true },
            { x: 700, y: 600, w: 600, h: 25, oneWay: true },
            { x: 300, y: 400, w: 300, h: 25, oneWay: true },
            { x: 1400, y: 400, w: 300, h: 25, oneWay: true },
            { x: 850, y: 250, w: 300, h: 25, oneWay: true }
        ];

        // ゲーム状態 (ホスト管理)
        let gameState = {
            status: 'title', // title, countdown, playing, result
            countdown: 3,
            timeLeft: 30,
            oni: 1,
            invincible: 0,
            winner: 0,
            p1: { x: 300, y: 1000, vx: 0, vy: 0, w: P_SIZE, h: P_SIZE, isGrounded: false, dir: 1 },
            p2: { x: 1600, y: 1000, vx: 0, vy: 0, w: P_SIZE, h: P_SIZE, isGrounded: false, dir: -1 }
        };

        let myKeys = { up: false, left: false, right: false };
        let clientKeys = { up: false, left: false, right: false };
        let rematchFlags = { host: false, client: false };

        let camera = { x: STAGE_W/2, y: STAGE_H/2, scale: 0.8 };
        let particles = []; // 爆発エフェクト用
        let hasExploded = false; // 爆発演出フラグ

        // UI要素
        const uiTitle = document.getElementById('title-screen');
        const uiResult = document.getElementById('result-screen');
        const uiHud = document.getElementById('hud');
        const statusMsg = document.getElementById('status-msg');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ---------------------------------------------------------
        // 4. WebRTC シグナリング処理
        // ---------------------------------------------------------
        async function createRoom() {
            roomId = document.getElementById('room-id').value.trim();
            if (!roomId) return alert("合言葉を入力してください");
            isHost = true; myPlayerId = 1;
            uiTitle.querySelector('.input-group').classList.add('hidden');
            statusMsg.innerText = "部屋を作成中...";

            const roomRef = ref(db, `rooms/${roomId}`);
            await remove(roomRef);

            pc = new RTCPeerConnection(rtcConfig);
            dc = pc.createDataChannel('gameData', { ordered: false, maxRetransmits: 0 });
            setupDataChannel();

            pc.onicecandidate = e => {
                if (e.candidate) push(ref(db, `rooms/${roomId}/hostIce`), e.candidate.toJSON());
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await set(ref(db, `rooms/${roomId}/offer`), { type: offer.type, sdp: offer.sdp });
            statusMsg.innerText = "相手の参加を待機中...";

            onValue(ref(db, `rooms/${roomId}/answer`), async snap => {
                if (snap.exists() && !pc.currentRemoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
                    for (let c of iceQueue) await pc.addIceCandidate(new RTCIceCandidate(c));
                    iceQueue = [];
                }
            });

            onChildAdded(ref(db, `rooms/${roomId}/clientIce`), snap => {
                if (snap.val()) {
                    if (pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(snap.val()));
                    else iceQueue.push(snap.val());
                }
            });
        }

        async function joinRoom() {
            roomId = document.getElementById('room-id').value.trim();
            if (!roomId) return alert("合言葉を入力してください");
            isHost = false; myPlayerId = 2;
            uiTitle.querySelector('.input-group').classList.add('hidden');
            statusMsg.innerText = "部屋に参加中...";

            const offerSnap = await get(ref(db, `rooms/${roomId}/offer`));
            if (!offerSnap.exists()) {
                alert("部屋が見つかりません。"); location.reload(); return;
            }

            pc = new RTCPeerConnection(rtcConfig);
            pc.ondatachannel = e => { dc = e.channel; setupDataChannel(); };

            pc.onicecandidate = e => {
                if (e.candidate) push(ref(db, `rooms/${roomId}/clientIce`), e.candidate.toJSON());
            };

            await pc.setRemoteDescription(new RTCSessionDescription(offerSnap.val()));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            await set(ref(db, `rooms/${roomId}/answer`), { type: answer.type, sdp: answer.sdp });
            statusMsg.innerText = "P2P接続を確立中...";

            onChildAdded(ref(db, `rooms/${roomId}/hostIce`), snap => {
                if (snap.val()) {
                    if (pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(snap.val()));
                    else iceQueue.push(snap.val());
                }
            });
        }

        function setupDataChannel() {
            dc.onopen = () => {
                console.log("WebRTC Connected!");
                off(ref(db, `rooms/${roomId}`)); // Firebase通信を切り離す
                uiTitle.classList.add('hidden');
                uiHud.classList.remove('hidden');
                initGame();
            };
            
            dc.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (isHost) {
                    if (data.type === 'input') clientKeys = data.keys;
                    if (data.type === 'rematch') rematchFlags.client = true;
                } else {
                    if (data.type === 'state') gameState = data.state;
                    if (data.type === 'rematch') rematchFlags.host = true;
                }
            };
        }

        // ---------------------------------------------------------
        // 5. ゲーム物理ロジック (ホスト側一元管理)
        // ---------------------------------------------------------
        function initGame() {
            gameState.status = 'countdown';
            gameState.countdown = 3.99;
            gameState.timeLeft = 30;
            gameState.oni = 1; // 最初はホスト(P1)が鬼
            gameState.invincible = 0;
            gameState.winner = 0;
            
            // プレイヤー初期位置リセット
            gameState.p1 = { x: 300, y: 1000, vx: 0, vy: 0, w: P_SIZE, h: P_SIZE, isGrounded: false, dir: 1 };
            gameState.p2 = { x: 1600, y: 1000, vx: 0, vy: 0, w: P_SIZE, h: P_SIZE, isGrounded: false, dir: -1 };
            
            rematchFlags = { host: false, client: false };
            particles = [];
            hasExploded = false;
            
            uiResult.classList.add('hidden');
            lastTime = performance.now();
            if (isHost) gameLoop();
            else clientLoop();
        }

        function isAABBOverlap(r1, r2) {
            return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
                   r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
        }

        function updatePlayerPhysics(p, keys, id, dt) {
            const isOni = (gameState.oni === id);
            const maxSpeed = isOni ? MAX_SPEED_ONI : MAX_SPEED_NIGE;
            const friction = p.isGrounded ? FRICTION_GROUND : FRICTION_AIR;

            // 左右の慣性移動と摩擦
            if (keys.left) { p.vx -= ACCEL * dt; p.dir = -1; }
            if (keys.right) { p.vx += ACCEL * dt; p.dir = 1; }
            if (!keys.left && !keys.right) p.vx *= Math.pow(friction, dt * 60);

            // X方向の最高速度制限
            p.vx = Math.max(-maxSpeed, Math.min(maxSpeed, p.vx));

            // ジャンプ (接地時のみ)
            if (keys.up && p.isGrounded) {
                p.vy = JUMP_FORCE;
                p.isGrounded = false;
            }

            // 重力の適用
            p.vy += GRAVITY * dt;
            p.vy = Math.min(p.vy, MAX_FALL_SPEED); // 終端速度

            // --- X軸の移動と衝突判定 ---
            p.x += p.vx * dt;
            // 画面端クランプ (画面外に出ないように)
            if (p.x < 0) { p.x = 0; p.vx = 0; }
            if (p.x + p.w > STAGE_W) { p.x = STAGE_W - p.w; p.vx = 0; }
            
            // ソリッドブロックとのX軸衝突
            for (let plat of platforms) {
                if (!plat.oneWay && isAABBOverlap(p, plat)) {
                    if (p.vx > 0) { p.x = plat.x - p.w; p.vx = 0; }
                    else if (p.vx < 0) { p.x = plat.x + plat.w; p.vx = 0; }
                }
            }

            // --- Y軸の移動と衝突判定 (すり抜け床のギミック) ---
            const oldBottom = p.y + p.h; // 移動前の足元のY座標
            p.y += p.vy * dt;
            p.isGrounded = false;

            for (let plat of platforms) {
                if (plat.oneWay) {
                    // すり抜け床: 下に落ちている最中 ＆ 前のフレームで床より上にいた場合のみ着地
                    if (p.x < plat.x + plat.w && p.x + p.w > plat.x) {
                        if (p.vy > 0 && oldBottom <= plat.y && p.y + p.h >= plat.y) {
                            p.y = plat.y - p.h;
                            p.vy = 0;
                            p.isGrounded = true;
                        }
                    }
                } else {
                    // ソリッドブロック (上下どちらからも衝突)
                    if (isAABBOverlap(p, plat)) {
                        if (p.vy > 0) { p.y = plat.y - p.h; p.vy = 0; p.isGrounded = true; }
                        else if (p.vy < 0) { p.y = plat.y + plat.h; p.vy = 0; }
                    }
                }
            }
        }

        let lastTime = 0;
        function gameLoop() {
            if (!isHost) return;
            const now = performance.now();
            let dt = (now - lastTime) / 1000;
            dt = Math.min(dt, 0.05); // フレーム落ち対策(最大0.05秒に制限)
            lastTime = now;

            if (gameState.status === 'countdown') {
                gameState.countdown -= dt;
                if (gameState.countdown <= 0) gameState.status = 'playing';
            } 
            else if (gameState.status === 'playing') {
                // 物理計算
                updatePlayerPhysics(gameState.p1, myKeys, 1, dt);
                updatePlayerPhysics(gameState.p2, clientKeys, 2, dt);
                
                // タッチ(鬼ごっこ)の判定
                if (gameState.invincible > 0) {
                    gameState.invincible -= dt;
                } else {
                    if (isAABBOverlap(gameState.p1, gameState.p2)) {
                        gameState.oni = gameState.oni === 1 ? 2 : 1; // 攻守交代
                        gameState.invincible = 0.5; // 0.5秒の無敵(連続タッチ防止)
                    }
                }
                
                // タイムダウン処理
                gameState.timeLeft -= dt;
                if (gameState.timeLeft <= 0) {
                    gameState.timeLeft = 0;
                    gameState.status = 'result';
                    // 鬼だった側が負け
                    gameState.winner = gameState.oni === 1 ? 2 : 1;
                }
            }
            else if (gameState.status === 'result') {
                // 再戦の同期確認
                if (rematchFlags.host && rematchFlags.client) {
                    initGame();
                    return requestAnimationFrame(gameLoop);
                }
            }

            // 状態をクライアントに同期
            if (dc && dc.readyState === 'open') {
                dc.send(JSON.stringify({ type: 'state', state: gameState }));
            }

            render(dt);
            requestAnimationFrame(gameLoop);
        }

        function clientLoop() {
            if (isHost) return;
            const now = performance.now();
            let dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            // 入力をホストへ送信
            if (dc && dc.readyState === 'open') {
                dc.send(JSON.stringify({ type: 'input', keys: myKeys }));
            }
            
            render(dt);
            requestAnimationFrame(clientLoop);
        }

        // ---------------------------------------------------------
        // 6. 爆発エフェクトと描画 (ダイナミックカメラ)
        // ---------------------------------------------------------
        const lerp = (a, b, n) => (1 - n) * a + n * b;

        function createExplosion(x, y, color) {
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 200 + Math.random() * 400;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    life: 1.0 + Math.random(),
                    color: color,
                    size: 4 + Math.random() * 6
                });
            }
        }

        function render(dt) {
            const p1 = gameState.p1;
            const p2 = gameState.p2;

            // --- ダイナミックカメラの計算 ---
            const midX = (p1.x + p1.w/2 + p2.x + p2.w/2) / 2;
            const midY = (p1.y + p1.h/2 + p2.y + p2.h/2) / 2;
            const dist = Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
            
            // 距離に応じたズーム (遠い=0.5倍, 近い=1.2倍)
            let t = Math.max(0, Math.min(1, (dist - 300) / 1000));
            const targetScale = lerp(1.2, 0.55, t);

            // Lerpで滑らかに追従
            camera.x = lerp(camera.x, midX, 0.1);
            camera.y = lerp(camera.y, midY, 0.1);
            camera.scale = lerp(camera.scale, targetScale, 0.08);

            // 背景クリア
            ctx.fillStyle = '#0b0c10';
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            ctx.save();
            ctx.translate(CANVAS_W / 2, CANVAS_H / 2);
            ctx.scale(camera.scale, camera.scale);
            ctx.translate(-camera.x, -camera.y);

            // グリッド線描画 (スピード感・広さの演出)
            ctx.strokeStyle = '#111318';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=0; i<=STAGE_W; i+=200) { ctx.moveTo(i,0); ctx.lineTo(i,STAGE_H); }
            for(let i=0; i<=STAGE_H; i+=200) { ctx.moveTo(0,i); ctx.lineTo(STAGE_W,i); }
            ctx.stroke();

            // ステージ外枠
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, STAGE_W, STAGE_H);

            // ブロック(足場)の描画
            platforms.forEach(plat => {
                if (plat.oneWay) {
                    // すり抜け床 (上面だけ光らせる)
                    ctx.fillStyle = 'rgba(31, 40, 51, 0.7)';
                    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                    ctx.fillStyle = '#38fc9d';
                    ctx.fillRect(plat.x, plat.y, plat.w, 4);
                } else {
                    // ソリッド壁 (ベタ塗り)
                    ctx.fillStyle = '#1f2833';
                    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                    ctx.strokeStyle = '#45f3ff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
                }
            });

            // プレイヤー描画関数
            const drawPlayer = (p, id) => {
                const isOni = gameState.oni === id;
                const isMe = id === myPlayerId;
                const pColor = isOni ? '#ff2a5f' : '#45f3ff';

                // 爆発済みの敗者は描画しない
                if (gameState.status === 'result' && isOni) return;

                ctx.save();
                ctx.translate(p.x + p.w/2, p.y + p.h/2);

                // 無敵時の点滅
                if (gameState.invincible > 0 && isOni) {
                    ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(Date.now() / 60));
                }

                // 本体 (角丸の四角形)
                ctx.beginPath();
                ctx.roundRect(-p.w/2, -p.h/2, p.w, p.h, 8);
                ctx.fillStyle = pColor;
                ctx.shadowColor = pColor;
                ctx.shadowBlur = isOni ? 20 : 10;
                ctx.fill();
                ctx.shadowBlur = 0;

                // 目の描画 (進行方向を向く)
                ctx.fillStyle = '#fff';
                const eyeOffset = p.dir * 8;
                ctx.fillRect(eyeOffset - 12, -8, 8, 8); // 左目
                ctx.fillRect(eyeOffset + 4, -8, 8, 8);  // 右目

                ctx.restore();

                // 鬼の頭上にタイマー表示
                if (isOni && gameState.status === 'playing') {
                    ctx.fillStyle = '#fff';
                    ctx.font = '24px bold sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(Math.ceil(gameState.timeLeft), p.x + p.w/2, p.y - 15);
                }

                // 自分の目印
                if (isMe) {
                    ctx.fillStyle = '#fff';
                    ctx.font = '14px bold sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('YOU', p.x + p.w/2, p.y - (isOni ? 45 : 15));
                }
            };

            drawPlayer(p1, 1);
            drawPlayer(p2, 2);

            // タイムアップ時の爆発エフェクト処理
            if (gameState.status === 'result') {
                if (!hasExploded) {
                    // 負けたプレイヤー(鬼)の位置で爆発
                    const loserP = gameState.oni === 1 ? p1 : p2;
                    createExplosion(loserP.x + loserP.w/2, loserP.y + loserP.h/2, '#ff2a5f');
                    hasExploded = true;
                }
                
                // パーティクルの更新と描画
                particles.forEach((pt, index) => {
                    pt.x += pt.vx * dt;
                    pt.y += pt.vy * dt;
                    pt.vy += GRAVITY * 0.5 * dt; // パーティクルにも重力
                    pt.life -= dt;
                    
                    if (pt.life > 0) {
                        ctx.globalAlpha = pt.life;
                        ctx.fillStyle = pt.color;
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
                        ctx.fill();
                    } else {
                        particles.splice(index, 1);
                    }
                });
                ctx.globalAlpha = 1.0;
            }

            ctx.restore();

            updateHUD();

            // カウントダウン描画 (画面中央固定)
            if (gameState.status === 'countdown') {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 100px sans-serif';
                ctx.textAlign = 'center';
                const countStr = Math.ceil(gameState.countdown).toString();
                ctx.fillText(countStr, CANVAS_W/2, CANVAS_H/2 + 35);
            }
        }

        function updateHUD() {
            document.getElementById('time-display').innerText = Math.ceil(gameState.timeLeft);
            
            const roleEl = document.getElementById('role-text');
            if (gameState.oni === myPlayerId) {
                roleEl.innerText = '【 鬼 】';
                roleEl.className = 'text-oni';
            } else {
                roleEl.innerText = '【 逃げ 】';
                roleEl.className = 'text-nige';
            }

            // リザルト画面制御
            if (gameState.status === 'result' && uiResult.classList.contains('hidden')) {
                uiResult.classList.remove('hidden');
                document.getElementById('rematch-status').innerText = "";
                
                const desc = document.getElementById('result-desc');
                if (gameState.winner === myPlayerId) {
                    desc.innerText = "YOU WIN! 🎉";
                    desc.style.color = "var(--primary)";
                } else {
                    desc.innerText = "YOU LOSE... 💥";
                    desc.style.color = "var(--danger)";
                }
            }
        }

        // ---------------------------------------------------------
        // 7. 入力イベント (WASD & 矢印キー)
        // ---------------------------------------------------------
        function handleKey(e, isDown) {
            // input要素(合言葉入力中)はキーイベントを無視
            if (e.target.tagName === 'INPUT') return;

            const key = e.key.toLowerCase();
            if (['w', 'arrowup', ' '].includes(key)) { myKeys.up = isDown; e.preventDefault(); }
            if (['a', 'arrowleft'].includes(key)) { myKeys.left = isDown; e.preventDefault(); }
            if (['d', 'arrowright'].includes(key)) { myKeys.right = isDown; e.preventDefault(); }
        }
        window.addEventListener('keydown', e => handleKey(e, true));
        window.addEventListener('keyup', e => handleKey(e, false));

        // ボタンイベント
        document.getElementById('btn-create').addEventListener('click', createRoom);
        document.getElementById('btn-join').addEventListener('click', joinRoom);
        
        document.getElementById('btn-rematch').addEventListener('click', () => {
            document.getElementById('rematch-status').innerText = "相手の準備を待機中...";
            if (isHost) {
                rematchFlags.host = true;
            } else {
                rematchFlags.client = true;
                if (dc && dc.readyState === 'open') {
                    dc.send(JSON.stringify({ type: 'rematch' }));
                }
            }
        });

    </script>
</body>
</html>
